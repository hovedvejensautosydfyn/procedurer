<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procedurer</title>
<meta name="description" content="Tjeklister til Hovedvejens Auto Sydfyn">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Procedurer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Skrifttypen hentes uden at blokere visningen; indtil den er hentet (eller uden net) bruges systemets skrift. -->
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #0E0E10;
    --surface: #18181B;
    --surface-2: #222226;
    --line: #2A2A2F;
    --line-strong: #3A3A40;
    --ink: #F4F4F5;
    --muted: #A1A1AA;
    --brand: #FE1C19;          /* kun pynt: streger, prikker */
    --accent: #FF5C59;         /* rød tekst/ikoner/kanter på mørk */
    --accent-hover: #FF7A77;
    --accent-fill: #E3120F;    /* fyldte knapper – altid med hvid tekst */
    --accent-fill-hover: #F2231F;
    --accent-ink: #FFFFFF;
    --accent-soft: #3A1514;
    --ok: #4ADE80;
    --ok-soft: #10301C;
    --danger: #FB7185;
    --danger-soft: #3B1220;
    --warn-soft: #33270C;
    --warn-ink: #F5C463;
    --focus: #FF5C59;
    --bar: #000000;
    --bar-ink: #FFFFFF;
    --bar-muted: #A1A1AA;
    --bar-line: #1F1F23;
    --plate-bg: #F4F4F2;
    --plate-ink: #111111;
    --plate-red: #C8102E;
    --plate-eu: #003399;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    --radius: 12px;
    --radius-sm: 8px;
    --f-body: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-disp: "Teko", "Bahnschrift", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* 16 px i felter, så iPhone ikke zoomer ind, når man trykker i dem */
  input, select, textarea { font-size: 16px; }
  input[type="text"], input[type="search"], input:not([type]), textarea { -webkit-appearance: none; appearance: none; }
  a, button, label, summary, select, input { touch-action: manipulation; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Sikre områder på iPhone (hak, hjemmelinje og sider i liggende visning) */
  /* Topbjælke: sort i fuld bredde som h-auto.dk; indholdet centreres i appens bredde */
  .top {
    background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line);
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px), calc((100% - 900px) / 2 + 24px)) 12px max(24px, env(safe-area-inset-left, 0px), calc((100% - 900px) / 2 + 24px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; min-width: 0; }
  .brand svg, .brand small { display: none; }
  .brand .logo { height: 28px; width: auto; display: block; flex: none; }
  .brand > div { font-family: var(--f-disp); font-weight: 500; font-size: 21px; line-height: 1; letter-spacing: .07em; text-transform: uppercase; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--bar-line); white-space: nowrap; }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .ghost {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid transparent;
    background: none; color: var(--muted); text-decoration: none; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .ghost:hover { color: var(--ink); background: var(--surface-2); }
  .top .ghost { color: var(--bar-muted); }
  .top .ghost:hover { color: var(--bar-ink); background: rgba(255, 255, 255, .08); }

  .tabs { max-width: 900px; margin: 0 auto; padding: 6px max(24px, env(safe-area-inset-right, 0px)) 0 max(24px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs a {
    padding: 10px 14px 11px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14.5px;
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand); }

  main { max-width: 900px; margin: 0 auto; padding: 22px max(24px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
  /* Beskeden om ugemte ændringer ligger i det almindelige flow lige under fanerne, med fast højde (én linje),
     så den aldrig dækker fanerne, personknappen eller fremdriftslinjen, og højden ikke ændrer sig mellem tilstande. */
  .sync { max-width: 900px; margin: 0 auto; padding: 8px max(24px, env(safe-area-inset-right, 0px)) 0 max(24px, env(safe-area-inset-left, 0px)); }
  .sync .banner { margin: 0; height: 46px; padding: 0 8px 0 12px; overflow: hidden; }
  .sync .banner > span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync .banner button { padding: 6px 12px; min-height: 34px; white-space: nowrap; }
  h1 { font-family: var(--f-disp); font-size: 34px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; margin: 0; font-weight: 600; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; background: var(--brand); border-radius: 2px; margin-top: 6px; }
  .car-head h1::after { display: none; }
  h2 { font-size: 16px; margin: 0; font-weight: 700; }
  h3 { font-size: 12.5px; margin: 26px 0 8px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .muted { color: var(--muted); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .head p { margin: 4px 0 0; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 12px; }
  .back:hover { color: var(--ink); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--line-strong); margin: 0 0 16px; font-size: 14px; }
  .banner.error { background: var(--danger-soft); color: var(--danger); }
  .banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .banner button { flex: none; }

  /* Dansk nummerplade: hvid, rød kant, blå EU-strimmel */
  .plate {
    display: inline-flex; align-items: stretch; overflow: hidden; font-weight: 700; letter-spacing: .1em; white-space: nowrap;
    padding: 0 8px 0 0; border: 2px solid var(--plate-red); border-radius: 5px; background: var(--plate-bg); color: var(--plate-ink); font-size: 13.5px; line-height: 1.5;
  }
  .plate::before { content: "DK"; display: flex; align-items: flex-end; margin-right: 7px; padding: 0 3px 2px; background: var(--plate-eu); color: #fff; font: 700 7.5px/1 var(--f-body); letter-spacing: 0; }
  .row > .plate { width: 112px; }
  .plate.none { border-color: var(--line-strong); color: var(--muted); background: var(--surface-2); letter-spacing: 0; font-weight: 500; padding: 0 8px; justify-content: center; }
  .plate.none::before { content: none; }
  .plate.big { font-size: 20px; border-width: 2px; line-height: 1.4; }
  .plate.big::before { font-size: 9.5px; padding: 0 4px 3px; margin-right: 10px; }
  .plate.big { padding-right: 12px; }
  .plate.none.big { padding: 0 12px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; white-space: nowrap; }
  .pill.open { background: var(--warn-soft); color: var(--warn-ink); }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.cancel { text-decoration: line-through; }

  input[type="text"], input[type="search"], input:not([type]), select, textarea {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 76px; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; color: color-mix(in srgb, var(--muted) 75%, transparent); opacity: 1; }
  [aria-invalid="true"] { border-color: var(--danger) !important; }
  .field { margin-bottom: 14px; }
  .field > label, .label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }

  .primary, .secondary { min-height: 44px; font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; line-height: 1.2; }
  .primary {
    border: 0; border-radius: var(--radius-sm); padding: 10px 18px;
    background: var(--accent-fill); color: var(--accent-ink); cursor: pointer; transition: background .15s, opacity .15s;
  }
  .primary:hover:not(:disabled) { background: var(--accent-fill-hover); }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .secondary { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--radius-sm); padding: 10px 15px; cursor: pointer; transition: background .15s; }
  .secondary:hover:not(:disabled) { background: var(--surface-2); }
  .secondary:disabled { opacity: .5; cursor: not-allowed; }
  .secondary.danger-btn { border-color: var(--danger); }
  .danger-btn { color: var(--danger); }
  .link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 14px; font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn.danger { color: var(--danger); }
  .search { max-width: 360px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar .grow { flex: 1; min-width: 200px; }

  /* Lister */
  .list { list-style: none; margin: 0; padding: 4px; }
  .row {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
    padding: 12px 12px; border-radius: 10px; text-decoration: none; color: inherit;
  }
  a.row:hover, button.row:hover { background: var(--surface-2); }
  button.row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
  .row-main { min-width: 0; }
  .row-title, .row-sub { display: block; }
  .row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-side { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .list li + li .row { border-top: 1px solid var(--line); border-radius: 0; }
  .list li + li a.row:hover { border-radius: 10px; border-top-color: transparent; }
  .empty { color: var(--muted); font-size: 14px; padding: 16px; margin: 0; }
  details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin: 26px 0 8px; list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "▸ "; }
  details.more[open] > summary::before { content: "▾ "; }

  .bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent-fill); border-radius: 99px; transition: width .2s; }
  .mini-bar { width: 72px; }

  /* Bil */
  .car-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .proc-grid { display: grid; gap: 14px; margin-top: 20px; }
  .proc-card { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
  .proc-card p { margin: 2px 0 0; font-size: 14px; }
  .proc-card .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .proc-card .bar { grid-column: 1 / -1; margin-top: 6px; }

  /* Tjekliste */
  .run-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 12px; margin-bottom: 4px; }
  .progress-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; line-height: 20px; margin-bottom: 7px; }
  .progress-line > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save-wrap { flex: none; white-space: nowrap; }
  /* Ét kort tekstlinje med fast højde, så fremdriftslinjen aldrig skifter højde (og punkterne under den ikke hopper). Er det ikke gemt, kan man trykke på den for at prøve nu.
     Den store trykflade (padding) udlignes af negativ margin, så linjen ikke bliver højere. */
  .save-state { display: block; flex: none; margin: -12px 0; padding: 12px 0; border: 0; background: none; font: inherit; line-height: 20px; white-space: nowrap; color: var(--muted); cursor: default; }
  .save-state:disabled { color: var(--muted); opacity: 1; }
  .save-state.error { color: var(--danger); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .sec { margin-bottom: 16px; overflow: hidden; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 18px 10px; flex-wrap: wrap; }
  .sec-count { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .skip-btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; cursor: pointer; color: var(--ink); }
  .skip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .skipped-note { margin: 0; padding: 0 18px 16px; color: var(--muted); font-size: 14px; }
  .items { list-style: none; margin: 0; padding: 0 8px 8px; }
  .item { border-top: 1px solid var(--line); padding: 12px 10px; }
  .items li:first-child .item { border-top: 0; }
  .item-text { font-weight: 500; }
  .opt-tag { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .item-help { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .item-who { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .item.missing .item-text::after { content: ""; }
  .check-item { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; border-radius: 10px; }
  .check-item:hover { background: var(--surface-2); }
  .check-item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box {
    flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line-strong); background: var(--surface);
    display: grid; place-items: center; margin-top: -1px; transition: background .12s, border-color .12s;
  }
  .box svg { opacity: 0; color: #0E0E10; }
  .check-item input:checked + .box { background: var(--ok); border-color: var(--ok); }
  .check-item input:checked + .box svg { opacity: 1; }
  .check-item input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
  .check-item input:disabled + .box { opacity: .6; }
  .answer { margin-top: 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer;
    min-height: 42px; text-align: left; transition: background .12s, border-color .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--accent); }
  .opt:disabled { cursor: default; }
  .num-input { max-width: 200px; }
  .readonly-answer { margin-top: 6px; font-weight: 500; }
  .readonly-answer.none { color: var(--muted); font-weight: 400; }
  .done-mark { color: var(--ok); }
  .note-card { padding: 16px 18px; margin-bottom: 16px; }
  .note-card p { margin: 0; white-space: pre-wrap; }
  .finish {
    position: sticky; bottom: 0; z-index: 5; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); padding: 14px 0 calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin-top: 8px;
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .finish { flex-wrap: nowrap; }
  .finish-hint { font-size: 14px; color: var(--muted); min-width: 0; }
  .finish-hint button { font-size: 14px; text-align: left; }
  .finish .primary { flex: none; }
  .hint-short { display: none; }
  .cancel-line { text-align: center; margin: 18px 0 0; }

  /* Redigering */
  .ed-top { padding: 20px; margin-bottom: 16px; }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 11px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--line-strong); color: var(--ink); }
  .ed-sec { padding: 16px 16px 10px; margin-bottom: 16px; }
  .ed-sec-head { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
  .ed-sec-head .field { flex: 1; margin: 0; }
  .ed-tools { display: flex; gap: 2px; flex: none; padding-top: 22px; }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 0;
    background: none; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn.danger:hover:not(:disabled) { color: var(--danger); }
  .ed-skip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; margin: 0 0 12px; }
  .ed-skip input[type="text"] { width: auto; flex: 1; min-width: 180px; padding: 7px 10px; }
  .tick { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
  .tick input { width: 17px; height: 17px; accent-color: var(--accent-fill); margin: 0; }
  .ed-items { list-style: none; margin: 0; padding: 0; }
  .ed-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
  .ed-item-row { display: flex; gap: 8px; align-items: flex-start; }
  .ed-item-row .field { flex: 1; margin: 0; }
  .ed-item-opts { display: grid; grid-template-columns: 170px auto; gap: 10px 16px; align-items: center; margin-top: 10px; }
  .ed-item-extra { margin-top: 10px; display: grid; gap: 10px; }
  .ed-item-extra textarea { min-height: 60px; }
  .ed-add { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
  .ed-actions {
    position: sticky; bottom: 0; z-index: 5; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
    border-top: 1px solid var(--line); padding: 14px 0 calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap;
  }
  .ed-error { color: var(--danger); font-size: 14px; margin-right: auto; }

  dialog {
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0; width: min(440px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  dialog form { padding: 22px; }
  dialog h2 { font-size: 18px; margin-bottom: 6px; }
  dialog p { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .dialog-actions .primary { padding: 10px 18px; }

  .photo-btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .photo-box { padding: 16px 18px; margin-bottom: 4px; }
  .photo-status { margin: 10px 0 0; font-size: 14px; }

  .code-display { font-family: var(--f-disp); font-size: 48px; font-weight: 600; letter-spacing: .14em; text-align: center; padding: 14px 8px; margin: 4px 0 10px; background: var(--accent-soft); border-radius: var(--radius-sm); }
  .tip { font-size: 14px; margin: 16px 0 0; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--muted); }

  @media (max-width: 600px) {

    .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .brand > div { font-size: 20px; margin-left: 10px; padding-left: 10px; }
    .row { grid-template-columns: auto minmax(0, 1fr); }

    .ed-item-opts { grid-template-columns: 1fr; }

  @media print {

  /* Review-rettelser: tydeligere kanter på felter og afkrydsningsbokse (3:1), større trykflader i topbjælken */
  input[type="text"]:not(:focus):not([aria-invalid="true"]), input[type="search"]:not(:focus):not([aria-invalid="true"]), input[type="number"]:not(:focus):not([aria-invalid="true"]), input[type="date"]:not(:focus):not([aria-invalid="true"]), input[type="tel"]:not(:focus):not([aria-invalid="true"]), input:not([type]):not(:focus):not([aria-invalid="true"]), select:not(:focus), textarea:not(:focus) { border-color: #6B6B74; }

<header class="top">
  <div class="brand">

      <rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8.5 9l1.6 1.6L13 7.7M8.5 15l1.6 1.6L13 13.7M15.5 9.5h1M15.5 15.5h1"/>
    </svg>

  </div>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>

      <span class="label-text" id="userName"></span>
    </button>
  </div>
</header>
<nav class="tabs" aria-label="Sider">
  <a href="#/biler" data-tab="biler">Biler</a>
  <a href="#/historik" data-tab="historik">Historik</a>
  <a href="#/procedurer" data-tab="procedurer">Procedurer</a>
</nav>
<div class="sync" id="sync" hidden>
  <div class="banner warn" role="alert"><span id="syncText" title=""></span><button class="secondary" type="button" data-action="retry-save">Prøv nu</button></div>
</div>

<main id="view" tabindex="-1">

</main>

<dialog id="carDialog" aria-labelledby="carDialogTitle">
  <form id="carForm" method="dialog" novalidate>
    <h2 id="carDialogTitle">Bil uden for Bilarkivet</h2>
    <p>Brug den, hvis bilen ikke er oprettet i Bilarkivet endnu.</p>
    <div class="field">
      <label for="manualReg">Reg.nr.</label>
      <input id="manualReg" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" placeholder="AB12345">
    </div>

      <label for="manualModel">Mærke og model</label>
      <input id="manualModel" type="text" autocomplete="off" maxlength="120" placeholder="fx VW Golf 1.5 TSI">
    </div>

    <div class="dialog-actions">
      <button class="secondary" type="button" data-close>Annullér</button>
      <button class="primary" type="submit">Fortsæt</button>
    </div>

</dialog>

    </div>
  </form>
</dialog>

      <button class="secondary danger-btn" type="button" id="accountLogout">Log ud på denne enhed</button>
      <button class="primary" type="button" data-close>Luk</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var TZ = 'Europe/Copenhagen';
  var STATUS = { OPEN: 'I gang', DONE: 'Gennemført', CANCELLED: 'Annulleret' };

  var CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICONS = {
    up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>'
  };

  var S = {
    state: null,          // svar fra getState
    loadedAt: 0,
    loadError: '',
    run: null,            // åben tjekliste
    runError: '',
    pending: 0,           // gemninger, der ikke er færdige (S.ops.length)
    saveFailed: false,    // serveren afviste en gemning
    key: '',              // adgangsnøglen til denne enhed
    skew: 0,              // serverens tid minus enhedens tid (ms), så ændringer får serverens tid selv om uret går forkert
    ops: [],              // gemninger i kø: { name, arg }. Gemmes også på enheden, til serveren har bekræftet dem
    sending: false,
    netDown: false,       // sidste forsøg på at gemme nåede ikke serveren
    retries: 0,
    setupError: '',       // serveren er sat forkert op (ikke noget, der hjælper at prøve igen)
    retryTimer: 0,
    waiters: [],          // venter på, at køen bliver tom (eller at forbindelsen svigter)
    resumed: 0,           // gemninger fra sidste gang, som sendes nu
    pairNotice: '',
    renderDeferred: false,
    manualCars: {},       // biler skrevet ind i hånden i denne session
    dfPhoto: null,        // billede valgt til en ny fejl: { key, file }
    noteDraft: null,      // note, der skrives på en bil, men endnu ikke er sendt: { key, text }
    noteTimer: 0,
    info: {},             // udstyr, fejl og mangler og note pr. bil (nøgle = bilens nøgle), hentet med getCarInfo
    newCar: null,         // skærmen "Ny bil" (opslag og udfyldning)
    uploads: {},          // billeder, der gemmes, pr. bil: { total, done, active, queue, failed }
    search: '',
    hist: { proc: '', status: '', q: '', limit: 200 },
    editor: null,
    editorFor: null,
    dirty: false,
    editorError: null,
    hash: '',             // den aktuelle side, fx "#/bil/a:abc123"
    keySeq: 0
  };

  var view = document.getElementById('view');

  // ---------------------------------------------------------------------------
  // Hjælpere
  // ---------------------------------------------------------------------------

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  // ---------- Serveren (Apps Script som API) ----------

  var API_URL = String(window.PROCEDURER_API_URL || '').trim();

  var RETRY_MS = window.PROCEDURER_RETRY_MS || 2000;
  var SETUP_RETRY_MS = window.PROCEDURER_SETUP_RETRY_MS || 60000;
  var KEY_STORE = 'procedurer.key';
  var OPS_STORE = 'procedurer.ops';
  var SKEW_STORE = 'procedurer.skew';       // serverens ur minus enhedens (ms)
  var LASTAT_STORE = 'procedurer.lastAt';   // tidspunktet for den seneste ændring, så tidspunkter kun går fremad
  var QUEUED = { answerChecklistItem: true, skipChecklistSection: true, saveChecklistNote: true, saveCarInfo: true }; // kan sendes igen uden skade
  var NEW_FUNCTIONS = { lookupPlate: true, createCar: true, getCarInfo: true, saveCarInfo: true, uploadPhoto: true };
  var NEEDS_NEW_SERVER = 'Kræver ny serverversion';
  var PHOTO_TIMEOUT_MS = window.PROCEDURER_PHOTO_TIMEOUT_MS || 120000;  // et billede er flere MB og kan tage tid på dårligt net
  var PHOTO_MAX_SIDE = 2560;                                            // længste side i pixel, når et billede skaleres
  var PHOTO_QUALITY = 0.85;                                             // JPEG-kvalitet

  // localStorage kan mangle (fx privat fane). Så huskes værdierne, så længe siden er åben.
  var memStore = {};
  var store = {
    get: function (k) {
      if (Object.prototype.hasOwnProperty.call(memStore, k)) return memStore[k];
      try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; }
    },
    set: function (k, v) {
      try { window.localStorage.setItem(k, v); delete memStore[k]; return true; } catch (e) { memStore[k] = v; return false; }
    },
    remove: function (k) {
      delete memStore[k];
      try { window.localStorage.removeItem(k); } catch (e) { /* intet at slette */ }
    }
  };
  S.key = store.get(KEY_STORE);
  S.skew = Number(store.get(SKEW_STORE)) || 0;
  S.lastAt = Number(store.get(LASTAT_STORE)) || 0;
  // Noter, der ikke blev gemt, fordi de var ændret andetsteds: { bilens nøgle: { mine, by, reg } }. Gemmes på enheden som køen, så de overlever en genstart.
  S.noteConflicts = {};
  try { S.noteConflicts = JSON.parse(store.get('procedurer.noteConflicts') || '{}') || {}; } catch (e) { S.noteConflicts = {}; }

  var SETUP_MESSAGE = 'Serveren er ikke sat op rigtigt. Se Fejlfinding i vejledningen (README): webappen skal være delt med "Alle", og adressen skal slutte på /exec.';

  function appError(message, code, retry) {
    var err = new Error(message);
    err.code = code || '';
    err.retry = !!retry;   // forbindelsen eller serveren svarede ikke: kan prøves igen
    return err;
  }

  /** Ét kald til serveren. Afviser med en Error, hvor code er AUTH, INPUT, LIMIT, SERVER eller SETUP, og retry er sand ved netfejl. */
  function call(name, arg, timeoutMs) {
    if (!API_URL) return Promise.reject(appError('Appen er ikke sat op endnu. Adressen til serveren mangler i filen config.js.', 'SETUP'));

    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || TIMEOUT_MS) : 0;
    // text/plain er en "simpel" forespørgsel: ingen forhåndsforespørgsel, som Apps Script ikke kan svare på.
    return fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body,
      redirect: 'follow', cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (res.status === 401 || res.status === 403 || res.status === 404) throw appError(SETUP_MESSAGE, 'SETUP');
      return res.text().then(function (text) { return { res: res, text: text }; });
    }).then(function (got) {
      clearTimeout(timer);
      var text = got.text;
      var json = null;
      try { json = JSON.parse(text); } catch (e) { json = null; }
      if (!json || typeof json.ok !== 'boolean') {
        // Googles login-side: webappen er ikke delt med "Alle", eller adressen er ikke /exec. Det hjælper ikke at prøve igen.
        if (/^\s*</.test(text) && /ServiceLogin|accounts\.google\.com\/(v3\/)?signin|AccountChooser/i.test(text)) throw appError(SETUP_MESSAGE, 'SETUP');
        throw appError('Serveren svarede ikke som forventet. Prøv igen om lidt.', 'SERVER', true);
      }
      if (!got.res.ok) throw appError('Serveren svarede ikke som forventet. Prøv igen om lidt.', 'SERVER', true);
      if (json.ok) return json.data;
      var err = appError(String(json.error || 'Noget gik galt. Prøv igen.'), String(json.code || 'SERVER'));
      if (err.code === 'AUTH' && name !== 'pair') authLost();
      // "Regnearket er optaget": intet er sket, og kaldet kan sendes igen (ændringer i køen og billeder med samme uploadId er sikre at gentage).
      if (err.code === 'SERVER' && /^Regnearket er optaget/.test(err.message)) err.retry = true;

      // Den gamle serverkode kender ikke de nye funktioner: skjul dem i stedet for at vise fejl.
      if (NEW_FUNCTIONS[name] && err.code === 'INPUT' && err.message === 'Ukendt handling.') { S.legacyServer = true; if (S.state) render(); }
      throw err;
    }, function (err) {
      clearTimeout(timer);
      if (err && err.code) throw err;
      if (err && err.name === 'AbortError') throw appError('Serveren svarer ikke lige nu. Prøv igen om lidt.', 'SERVER', true);
      throw appError('Ingen forbindelse. Tjek internettet og prøv igen.', 'SERVER', true);
    });
  }

  var toastTimer = 0;
  function toast(text, isError) {
    var el = $('toast');
    el.textContent = text;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, isError ? 7000 : 3500);
  }

  /** Som toast, men med knappen "Fortryd". Beskeden står i 8 sekunder. */
  function toastUndo(text, onUndo) {
    var el = $('toast');
    el.textContent = text + ' ';
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'link-btn';
    b.setAttribute('data-undo', '1');
    b.style.cssText = 'color:inherit;text-decoration:underline;font-weight:600';
    b.textContent = 'Fortryd';
    b.onclick = function () { clearTimeout(toastTimer); el.className = 'toast'; onUndo(); };
    el.appendChild(b);
    el.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 8000);
  }

  var DATE_FMT = new Intl.DateTimeFormat('da-DK', { timeZone: TZ, day: 'numeric', month: 'short', year: 'numeric' });
  var TIME_FMT = new Intl.DateTimeFormat('da-DK', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  var MONTH_FMT = new Intl.DateTimeFormat('da-DK', { timeZone: TZ, month: 'long', year: 'numeric' });
  var DAY_KEY = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  function fmtDate(ms) { return ms ? DATE_FMT.format(new Date(ms)) : ''; }
  function fmtTime(ms) { return ms ? TIME_FMT.format(new Date(ms)) : ''; }
  function fmtWhen(ms) {
    if (!ms) return '';
    var d = DAY_KEY.format(new Date(ms));
    var today = DAY_KEY.format(new Date());
    var yesterday = DAY_KEY.format(new Date(Date.now() - 86400000));
    var day = d === today ? 'i dag' : d === yesterday ? 'i går' : fmtDate(ms);
    return day + ' kl. ' + fmtTime(ms);
  }
  function fmtIsoDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}/.test(iso || '')) return '';
    var p = iso.slice(0, 10).split('-');
    return fmtDate(Date.UTC(+p[0], +p[1] - 1, +p[2], 12));
  }
  function monthLabel(ms) { var s = MONTH_FMT.format(new Date(ms)); return s.charAt(0).toUpperCase() + s.slice(1); }

  function personName(email) {
    var names = S.state && S.state.userNames || {};
    return names[email] || email || '';
  }

  function formatNumberDa(n) {
    var parts = Math.abs(n).toFixed(2).replace(/\.?0+$/, '').split('.');
    var whole = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (n < 0 ? '-' : '') + whole + (parts[1] ? ',' + parts[1] : '');
  }

  function normalizeReg(v) { return String(v || '').replace(/\s+/g, ' ').trim().toUpperCase().replace(/[\s.-]/g, ''); }
  function plateText(reg) {
    var m = /^([A-ZÆØÅ]{2})(\d{2})(\d{3})$/.exec(reg || '');
    return m ? m[1] + ' ' + m[2] + ' ' + m[3] : (reg || '');
  }
  function plate(reg, big) {
    return reg
      ? '<span class="plate' + (big ? ' big' : '') + '">' + esc(plateText(reg)) + '</span>'
      : '<span class="plate none' + (big ? ' big' : '') + '">Uden reg.nr.</span>';
  }

  function carKey(car) {
    if (car.archiveId) return 'a:' + car.archiveId;
    if (car.reg) return 'r:' + normalizeReg(car.reg);
    return 'm:' + String(car.model || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function isAnswered(item, a) {
    if (!a) return false;
    return item.type === 'check' ? a.value === true : a.value !== null && a.value !== '';
  }
  /** Samme regel som runProgress i Logic.gs. */
  function progressOf(run) {
    var required = 0, done = 0, answered = 0, total = 0, missing = [];
    run.sections.forEach(function (section) {
      if (run.skipped[section.id]) return;
      section.items.forEach(function (item) {
        var ok = isAnswered(item, run.answers[item.id]);
        total++;
        if (ok) answered++;
        if (!item.required) return;
        required++;
        if (ok) done++; else missing.push({ sectionId: section.id, itemId: item.id, text: item.text });
      });
    });
    return { required: required, done: done, answered: answered, total: total, missing: missing };
  }
  function progressText(p) { return p.required ? p.done + ' af ' + p.required : p.answered + ' af ' + p.total; }
  function pct(p) {
    var of = p.required || p.total;
    return of ? Math.round(100 * (p.required ? p.done : p.answered) / of) : 100;
  }

  function statusPill(status) {
    var cls = status === STATUS.OPEN ? 'open' : status === STATUS.DONE ? 'done' : 'cancel';
    return '<span class="pill ' + cls + '">' + esc(status) + '</span>';
  }

  // ---------------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------------

  function setState(state) {
    S.state = state;
    S.regMap = {};
    S.archiveIds = {};
    (state.cars || []).forEach(function (c) {
      S.archiveIds[c.id] = true;
      if (c.reg && !S.regMap[c.reg]) S.regMap[c.reg] = 'a:' + c.id;
    });
    S.loadedAt = Date.now();
    if (typeof state.now === 'number') {
      S.skew = state.now - Date.now(); // forskel mellem serverens og enhedens ur
      store.set(SKEW_STORE, String(S.skew)); // huskes, så ændringer får serverens tid, også hvis appen åbnes uden forbindelse
    }
    S.loadError = '';
    var link = $('sheetLink');
    link.href = state.spreadsheetUrl;
    link.hidden = false;
    $('userName').textContent = personName(state.user);
    $('accountBtn').hidden = false;
  }

  function loadState(quiet) {
    return call('getState').then(function (state) {
      setState(state);
      render();
    }, function (err) {
      if (err.code === 'AUTH') return;
      if (quiet && S.state) return;
      S.loadError = err.message;
      render();
    });
  }

  /** Serveren har sagt, at nøglen ikke gælder (spærret eller slettet), eller brugeren har logget ud: tilbage til kodeskærmen. */
  function resetSession(notice) {
    var lost = S.ops.length;
    store.remove(KEY_STORE);
    store.remove(OPS_STORE);
    clearTimeout(S.retryTimer);
    S.key = '';
    S.ops = []; S.pending = 0; S.sending = false; S.netDown = false; S.setupError = ''; S.retries = 0; S.resumed = 0; S.saveFailed = false;
    S.state = null; S.run = null; S.runError = ''; S.loadError = ''; S.loadingRun = null;
    S.editor = null; S.editorFor = null; S.dirty = false; S.finishing = false; S.manualCars = {}; S.info = {}; S.newCar = null; S.uploads = {}; S.noteConflicts = {}; store.remove('procedurer.noteConflicts');
    S.pairNotice = notice + (lost ? ' Ændringer, der ikke var gemt, er gået tabt.' : '');
    S.hash = '#/biler';
    history.replaceState(null, '', S.hash);
    $('accountBtn').hidden = true;
    $('sheetLink').hidden = true;
    $('accountDialog').open && $('accountDialog').close();
    updateSync();
    settle(false);
    render(true);
  }
  function authLost() {
    if (!S.key) return;
    resetSession('Denne enhed er ikke godkendt længere. Indtast en ny kode for at bruge appen.');
  }

  /**
   * Bilens nøgle for en tjekliste. Er tjeklisten startet, før bilen kom i Bilarkivet
   * (eller før den blev slettet og oprettet igen med nyt id), hører den alligevel til
   * arkivbilen med samme reg.nr.
   */
  function keyOf(r) {
    var orphan = !r.car.archiveId || (S.state && S.state.archive.ok && !S.archiveIds[r.car.archiveId]);
    if (orphan && r.car.reg) {
      var k = S.regMap && S.regMap[normalizeReg(r.car.reg)];
      if (k) return k;
    }
    return r.key;
  }

  function archiveCars() {
    return (S.state.cars || []).map(function (c) {
      return { key: 'a:' + c.id, archiveId: c.id, reg: c.reg, model: c.model, year: c.year, status: c.status, boughtDate: c.boughtDate, soldDate: c.soldDate, folder: c.folder || '', createdAt: c.createdAt || '', inArchive: true };
    });
  }

  /** Biler oprettet fra telefonen, som Bilarkivet ikke har hentet endnu. Nøglen er den samme som for en bil skrevet ind i hånden (reg.nr.). */
  function pendingCars() {
    return (S.state.pending || []).map(function (p) {
      return { key: 'r:' + normalizeReg(p.reg), archiveId: '', pendingId: p.id, reg: p.reg, model: p.model, year: p.year, createdAt: p.createdAt, pending: true, duplicate: !!p.duplicate, inArchive: false };
    });
  }

  /** Biler fra tjeklister, der ikke (længere) står i Bilarkivet, og biler skrevet ind i hånden. */
  function otherCars(archive) {
    var known = {};
    archive.forEach(function (c) { known[c.key] = true; });
    var out = [];
    pendingCars().forEach(function (c) {
      if (known[c.key]) return;
      known[c.key] = true;
      out.push(c);
    });
    S.state.runs.forEach(function (r) {
      var k = keyOf(r);
      if (known[k]) return;
      known[k] = true;
      out.push({ key: k, archiveId: r.car.archiveId, reg: r.car.reg, model: r.car.model, inArchive: false });
    });
    Object.keys(S.manualCars).forEach(function (k) {
      if (!known[k]) { known[k] = true; out.push(S.manualCars[k]); }
    });
    return out;
  }

  function findCar(key) {
    var all = archiveCars();
    var hit = all.filter(function (c) { return c.key === key; })[0];
    return hit || otherCars(all).filter(function (c) { return c.key === key; })[0] || null;
  }

  function activeProcedures() {
    return S.state.procedures.filter(function (p) { return p.status !== 'Arkiveret'; });
  }

  function runsFor(key, procedureId) {
    return S.state.runs.filter(function (r) { return keyOf(r) === key && (!procedureId || r.procedureId === procedureId); });
  }

  function summaryFromRun(run) {
    return {
      id: run.id, procedureId: run.procedureId, procedureName: run.procedureName, car: run.car, key: run.key,
      status: run.status, progress: progressText(run.progress), startedAt: run.startedAt, startedBy: run.startedBy,
      finishedAt: run.finishedAt || 0, finishedBy: run.finishedBy, note: run.note.length > 160 ? run.note.slice(0, 157) + '…' : run.note
    };
  }
  function updateSummary(run) {
    if (!S.state) return;
    var s = summaryFromRun(run);
    var found = false;
    S.state.runs = S.state.runs.map(function (r) { if (r.id === run.id) { found = true; return s; } return r; });
    if (!found) S.state.runs.unshift(s);
  }

  // ---------------------------------------------------------------------------
  // Navigation
  // ---------------------------------------------------------------------------

  function parseRoute() {
    var h = S.hash.replace(/^#?\/?/, '');
    var i = h.indexOf('/');
    var name = i < 0 ? h : h.slice(0, i);
    var arg = i < 0 ? '' : h.slice(i + 1);
    try { arg = decodeURIComponent(arg); } catch (e) { arg = ''; }
    return { name: name || 'biler', arg: arg };
  }

  /* Siden vises i sin egen fane, så adressen (#/bil/…) styres med location.hash og tilbage-knappen med hashchange. */
  function pushHistory(hash, replace) {
    if (replace) history.replaceState(null, '', hash);
    else history.pushState(null, '', hash); // pushState udløser ikke hashchange
  }

  function go(hash, opts) {
    opts = opts || {};
    if (!/^#\//.test(hash)) hash = '#/biler';
    if (hash === S.hash && !opts.fromHistory) { render(true); return; }
    var leavingEditor = /^#\/procedure\//.test(S.hash) && hash !== S.hash;
    if (leavingEditor && S.dirty && !opts.force) {
      confirmBox('Kassér ændringerne?', 'Du har ændringer i proceduren, der ikke er gemt.', 'Kassér ændringer', true).then(function (ok) {
        if (ok) go(hash, { force: true, fromHistory: opts.fromHistory });
        else if (opts.fromHistory) pushHistory(S.hash, false); // browseren er allerede gået tilbage: læg redigeringen ind igen
      });
      return;
    }
    if (leavingEditor) { S.dirty = false; S.editor = null; S.editorFor = null; S.editorError = null; }
    S.hash = hash;
    if (!opts.fromHistory) pushHistory(hash, opts.replace);
    render(true);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', function () {
    if (location.hash === S.hash) return;
    go(location.hash, { fromHistory: true });
  });

  // Interne links (href="#/…") håndteres her, så siden ikke hopper, og så Ctrl-klik ikke åbner en ny, tom fane.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[href^="#/"]');
    if (!a || ev.button) return;
    ev.preventDefault();
    go(a.getAttribute('href'));
  });
  document.addEventListener('auxclick', function (ev) {
    if (ev.target.closest('a[href^="#/"]')) ev.preventDefault();
  });

  window.addEventListener('beforeunload', function (e) {
    if (S.dirty || S.pending || photosBusy()) { e.preventDefault(); e.returnValue = ''; }
  });

  // Hent nye biler og tjeklister, når appen kommer i forgrunden igen. På telefonen
  // kommer "focus" ikke altid frem, så "visibilitychange" bruges også.
  function refreshOnReturn() {
    if (document.visibilityState === 'hidden') return;
    if (S.ops.length) { flush(true); return; }   // ugemte ændringer sendes, før noget hentes
    if (!S.state || Date.now() - S.loadedAt < 20000 || S.pending) return;
    var r = parseRoute();
    if (r.name === 'procedure' || r.name === 'ny-bil') return;
    S.loadedAt = Date.now();
    if (r.name === 'tjekliste' && S.run && S.run.id === r.arg) refreshRun(r.arg);
    var shown = r.name === 'bil' ? findCar(r.arg) : null;
    if (shown && carRef(shown)) refreshCarInfo(shown);
    loadState(true);
  }
  window.addEventListener('focus', refreshOnReturn);
  document.addEventListener('visibilitychange', refreshOnReturn);
  window.addEventListener('online', function () { if (S.ops.length) flush(true); else refreshOnReturn(); });

  // ---------------------------------------------------------------------------
  // Tegning
  // ---------------------------------------------------------------------------

  /** Tegner siden igen og bevarer fokus på det element, der har samme data-key. */
  function render(navigating) {
    if (!S.key) { showPair(navigating); return; }
    document.body.classList.remove('unpaired');
    var active = document.activeElement;
    if (!navigating && active && view.contains(active) && /^(INPUT|TEXTAREA)$/.test(active.tagName) && active.type !== 'checkbox' && active.type !== 'radio' &&
        parseRoute().name !== 'procedure') {
      // Skriver brugeren i et felt, venter vi med at tegne den samme side igen, til feltet forlades.
      S.renderDeferred = true;
      return;
    }
    S.renderDeferred = false;
    var focusKey = active && view.contains(active) ? active.getAttribute('data-key') : null;
    var r = parseRoute();
    document.querySelectorAll('.tabs a').forEach(function (a) {
      var tab = a.getAttribute('data-tab');
      var on = tab === r.name || (tab === 'biler' && (r.name === 'bil' || r.name === 'tjekliste' || r.name === 'ny-bil')) || (tab === 'procedurer' && r.name === 'procedure');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    if (!S.state) {
      view.innerHTML = S.loadError
        ? '<div class="banner error" role="alert"><span>' + esc(S.loadError) + '</span><button class="secondary" type="button" data-action="reload">Prøv igen</button></div>'
        : '<div class="loading"><span class="spinner"></span> Henter …</div><p class="muted slow-hint">Det tager lidt længere end normalt. Appen venter på serveren.</p>';
      return;
    }

    var html;
    if (r.name === 'bil') html = viewCar(r.arg);
    else if (r.name === 'tjekliste') html = viewRun(r.arg);
    else if (r.name === 'ny-bil') html = viewNewCar();
    else if (r.name === 'historik') html = viewHistory();
    else if (r.name === 'procedurer') html = viewProcedures();
    else if (r.name === 'procedure') html = viewEditor(r.arg);
    else html = viewCars();
    view.innerHTML = html;
    document.body.classList.toggle('has-bar', !!view.querySelector('.finish, .ed-actions'));
    document.title = (r.name === 'tjekliste' && S.run ? S.run.procedureName + ' · ' : '') + 'Procedurer';
    updateSync();

    if (focusKey) {
      var again = view.querySelector('[data-key="' + focusKey.replace(/"/g, '') + '"]');
      if (again) again.focus({ preventScroll: true });
    }
  }

  function problemsBanner() {
    var p = S.state.problems || [];
    return p.length ? '<div class="banner error" role="alert"><span>' + p.map(esc).join('<br>') + '</span></div>' : '';
  }

  function archiveBanner() {
    var a = S.state.archive;
    if (a.ok) return '';
    return '<div class="banner warn" role="alert"><span><b>Bilarkivet kunne ikke læses.</b> ' + esc(a.error) +
      ' Du kan stadig bruge en bil uden for Bilarkivet.</span><button class="secondary" type="button" data-action="reload">Prøv igen</button></div>';
  }

  // ---------- Biler ----------

  function receivingApplies
(car) {
    var since = S.state.receivingSince || 0;
    return !!car.pending || !!(since && car.createdAt && Date.parse(car.createdAt) >= since);
  }

  function carStatusPills(car) {
    return activeProcedures().map(function (p) {
      var runs = runsFor(car.key, p.id);
      var open = runs.filter(function (r) { return r.status === STATUS.OPEN; })[0];
      if (open) return '<span class="pill open">' + esc(p.name) + ' i gang · ' + esc(open.progress) + '</span>';
      var done = runs.filter(function (r) { return r.status === STATUS.DONE; });
      if (p.repeat === 'once') {
        if (done.length) return '<span class="pill done">' + esc(p.name) + ' ✓</span>';
        if (car.status === 'solgt') return '';
        // "Modtagelse og test" er ny: den mangler kun på biler, der er oprettet efter, den kom, ikke på alle gamle lagerbiler.
        if (S.state.receivingProcedureId && p.id === S.state.receivingProcedureId && !receivingApplies(car)) return '';
        return '<span class="pill">' + esc(p.name) + ' mangler</span>';
      }
      return done.length ? '<span class="pill done">' + esc(p.name) + ' × ' + done.length + '</span>' : '';
    }).join('');
  }

  function carRow(car) {
    var sub = [car.year, car.inArchive ? (car.status === 'solgt' ? 'Solgt ' + fmtIsoDate(car.soldDate) : car.boughtDate ? 'Købt ' + fmtIsoDate(car.boughtDate) : '')
      : car.pending ? 'Oprettet ' + fmtWhen(car.createdAt) : 'Ikke i Bilarkivet']
      .filter(Boolean).join(' · ');
    return '<li><a class="row" href="#/bil/' + encodeURIComponent(car.key) + '">' + plate(car.reg) +
      '<span class="row-main"><span class="row-title">' + esc(car.model || 'Ukendt model') + '</span>' +
      (sub ? '<span class="row-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      '<span class="row-side">' + (car.pending ? '<span class="pill">' + (car.duplicate ? 'Dobbelt nummerplade – se Bilarkivet' : 'Venter på Bilarkivet') + '</span>' : '') + carStatusPills(car) + '</span></a></li>';
  }

  function matches(car, q) {
    if (!q) return true;
    var hay = (normalizeReg(car.reg) + ' ' + (car.model || '') + ' ' + (car.year || '')).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0 || normalizeReg(car.reg).toLowerCase().indexOf(normalizeReg(w).toLowerCase()) >= 0; });
  }

  function viewCars() {
    return '<div class="head"><div><h1>Biler</h1><p class="muted">Vælg en bil for at starte eller fortsætte en tjekliste.</p></div>' +
      '<div class="head-actions"><button class="secondary" type="button" data-action="manual-car">Bil uden for Bilarkivet</button>' +
      (newServer() ? '<button class="primary" type="button" data-action="new-car">Ny bil</button>'
        : '<button class="primary" type="button" data-action="new-car" disabled title="' + NEEDS_NEW_SERVER + '">Ny bil</button>') + '</div></div>' +
      (newServer() ? '' : '<p class="muted" style="margin:-6px 0 14px;font-size:13.5px">Ny bil: ' + NEEDS_NEW_SERVER + '.</p>') +
      problemsBanner() + archiveBanner() +
      '<div class="toolbar"><input type="search" class="search" id="carSearch" data-key="carSearch" placeholder="Søg på reg.nr. eller model" aria-label="Søg i biler" value="' + esc(S.search) + '"></div>' +
      '<div id="carLists">' + carLists() + '</div>';
  }

  function carLists() {
    var q = S.search.trim();
    var archive = archiveCars();
    var others = otherCars(archive);
    var open = S.state.runs.filter(function (r) { return r.status === STATUS.OPEN; });
    var stock = archive.filter(function (c) { return c.status !== 'solgt' && matches(c, q); });
    var sold = archive.filter(function (c) { return c.status === 'solgt' && matches(c, q); });
    var waiting = others.filter(function (c) { return c.pending && matches(c, q); });
    var rest = others.filter(function (c) { return !c.pending && matches(c, q); });
    var html = '';

    if (open.length && !q) {
      html += '<h3>I gang</h3><div class="card"><ul class="list">' + open.map(function (r) {
        return '<li><a class="row" href="#/tjekliste/' + encodeURIComponent(r.id) + '">' + plate(r.car.reg) +
          '<span class="row-main"><span class="row-title">' + esc(r.procedureName) + ' · ' + esc(r.car.model) + '</span>' +
          '<span class="row-sub">Startet ' + esc(fmtWhen(r.startedAt)) + ' af ' + esc(personName(r.startedBy)) + '</span></span>' +
          '<span class="row-side"><span class="pill open">' + esc(r.progress) + '</span></span></a></li>';
      }).join('') + '</ul></div>';
    }

    if (waiting.length) html += '<h3>Venter på Bilarkivet</h3><div class="card"><ul class="list">' + waiting.map(carRow).join('') + '</ul></div>';

    html += '<h3>På lager' + (stock.length ? ' (' + stock.length + ')' : '') + '</h3>';
    html += stock.length ? '<div class="card"><ul class="list">' + stock.map(carRow).join('') + '</ul></div>'
      : '<div class="card"><p class="empty">' + (q ? 'Ingen biler på lager passer til søgningen.' : S.state.archive.ok ? 'Der er ingen biler på lager i Bilarkivet.' : 'Bilerne kan ikke vises lige nu.') + '</p></div>';

    if (rest.length) html += '<h3>Andre biler</h3><div class="card"><ul class="list">' + rest.map(carRow).join('') + '</ul></div>';
    if (sold.length) {
      html += '<details class="more"' + (q ? ' open' : '') + '><summary>Solgte biler (' + sold.length + ')</summary><div class="card"><ul class="list">' +
        sold.map(carRow).join('') + '</ul></div></details>';
    }
    return html;
  }

  // ---------- Én bil ----------

  function viewCar(key) {
    var car = findCar(key);
    if (!car) {
      return '<a class="back" href="#/biler">' + ICONS.back + 'Biler</a><h1>Bilen blev ikke fundet</h1>' +
        '<p class="muted">Den er måske slettet i Bilarkivet.</p>';
    }
    var status = car.inArchive ? (car.status === 'solgt' ? 'Solgt ' + fmtIsoDate(car.soldDate) : 'På lager') : car.pending ? (car.duplicate ? 'Dobbelt nummerplade – se Bilarkivet' : 'Venter på Bilarkivet') : 'Ikke i Bilarkivet';

    var html = '<a class="back" href="#/biler">' + ICONS.back + 'Biler</a>' +
      '<div class="car-head">' + plate(car.reg, true) + '<h1>' + esc(car.model || 'Ukendt model') + '</h1></div>' +
      '<p class="muted" style="margin:6px 0 0">' + esc([car.year, status].filter(Boolean).join(' · ')) + '</p>' + archiveBanner();

    var procs = activeProcedures();
    html += '<div class="proc-grid">' + (procs.length ? procs.map(function (p) { return procCard(car, p); }).join('')
      : '<div class="card"><p class="empty">Der er ingen procedurer endnu. Opret en under <a href="#/procedurer">Procedurer</a>.</p></div>') + '</div>';

    var runs = runsFor(car.key);
    html += carInfoHtml(car);
    html += '<h3>Tjeklister på bilen</h3>';
    html += runs.length ? '<div class="card"><ul class="list">' + runs.map(runRow).join('') + '</ul></div>'
      : '<div class="card"><p class="empty">Der er ikke lavet nogen tjeklister på bilen endnu.</p></div>';
    return html;
  }

  function procCard(car, p) {
    var runs = runsFor(car.key, p.id);
    var open = runs.filter(function (r) { return r.status === STATUS.OPEN; })[0];
    var done = runs.filter(function (r) { return r.status === STATUS.DONE; });
    var last = done[0];
    var info, actions;
    var startAttrs = ' type="button" data-action="start" data-proc="' + esc(p.id) + '" data-car="' + esc(car.key) + '"';
    if (open) {
      info = 'I gang · ' + esc(open.progress) + ' · startet ' + esc(fmtWhen(open.startedAt)) + ' af ' + esc(personName(open.startedBy));
      actions = '<a class="primary" style="text-decoration:none" href="#/tjekliste/' + encodeURIComponent(open.id) + '">Fortsæt</a>';
    } else if (p.repeat === 'once' && last) {
      info = '<span class="done-mark">✓</span> Gennemført ' + esc(fmtWhen(last.finishedAt)) + ' af ' + esc(personName(last.finishedBy));
      actions = '<button class="secondary"' + startAttrs + ' data-again="1">Start igen</button>';
    } else {
      info = p.repeat === 'once' ? 'Ikke gennemført endnu'
        : done.length ? done.length + (done.length === 1 ? ' gennemført' : ' gennemførte') + ' · seneste ' + esc(fmtWhen(last.finishedAt))
        : 'Ingen endnu';
      actions = '<button class="primary"' + startAttrs + '>Start ' + esc(p.name.toLowerCase()) + '</button>';
    }
    return '<div class="card proc-card"><div><h2>' + esc(p.name) + '</h2><p class="muted">' + info + '</p></div>' +
      '<div class="actions">' + actions + '</div></div>';
  }

  function runRow(r) {
    var when = r.status === STATUS.OPEN ? 'Startet ' + fmtWhen(r.startedAt) + ' af ' + personName(r.startedBy)
      : (r.status === STATUS.DONE ? 'Gennemført ' : 'Annulleret ') + fmtWhen(r.finishedAt) + ' af ' + personName(r.finishedBy);
    return '<li><a class="row" href="#/tjekliste/' + encodeURIComponent(r.id) + '">' + plate(r.car.reg) +
      '<span class="row-main"><span class="row-title">' + esc(r.procedureName) + ' · ' + esc(r.car.model) + '</span>' +
      '<span class="row-sub">' + esc(when) + (r.note ? ' · ' + esc(r.note) : '') + '</span></span>' +
      '<span class="row-side">' + (r.status === STATUS.OPEN ? '<span class="pill open">' + esc(r.progress) + '</span>' : statusPill(r.status)) + '</span></a></li>';
  }

  // ---------- Udstyr, fejl og mangler, noter og billeder (på bilens side) ----------
  // Gælder biler, der har en mappe på Google Drive: nye biler fra telefonen og biler i Bilarkivet. Ændringerne vises med det
  // samme og sendes i samme kø som tjeklisternes svar (saveCarInfo), så de også kan laves uden forbindelse.

  /** Serverkoden fra før denne version sender ikke 'pending' med. Så vises de nye funktioner ikke. */
  function newServer() { return !S.legacyServer && !(S.state && !Array.isArray(S.state.pending)); }

  function carRef(car) {
    if (!newServer()) return null;
    if (car.pending) return { pendingId: car.pendingId };
    if (car.inArchive && car.folder) return { archiveId: car.archiveId };
    return null;
  }
  function newItemId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function onCarPage(key) { var r = parseRoute(); return r.name === 'bil' && r.arg === key; }
  function carOpPending(key) {
    return S.ops.some(function (op) { return op.name === 'saveCarInfo' && op.arg.carKey === key; });
  }

  /** Henter bilens udstyr, fejl og note første gang bilens side vises. */
  function ensureCarInfo(car) {
    var info = S.info[car.key];
    if (info) return info;
    // notesBase er updatedAt for den version af noten, serveren sidst har bekræftet. Det er den, en ny note bygger på (også flere i køen).
    info = S.info[car.key] = { loading: true, error: '', equipment: [], defects: [], notes: { text: '', updatedAt: 0, by: '' }, notesBase: 0 };
    call('getCarInfo', carRef(car)).then(function (res) {
      info.loading = false;
      if (!carOpPending(car.key)) { info.equipment = res.info.equipment; info.defects = res.info.defects; info.notes = res.info.notes; info.notesBase = res.info.notes.updatedAt; }
      if (onCarPage(car.key)) render();
    }, function (err) {
      info.loading = false;
      if (err.code === 'AUTH') return;
      info.error = err.message;
      if (onCarPage(car.key)) render();
    });
    return info;
  }

  function trashButton(action, id, what) {
    return '<button class="icon-btn danger" type="button" data-action="' + action + '" data-id="' + esc(id) + '" aria-label="Fjern ' + esc(what) + '" title="Fjern">' + ICONS.trash + '</button>';
  }

  function uploadStatus(key) {
    var u = S.uploads[key];
    if (!u) return { html: 'Billeder taget her gemmes i bilens mappe på Google Drive og ikke i kamerarullen. Bilarkivet henter dem derfra.', error: false };
    var progress = u.done + ' af ' + u.total + ' gemt';
    if (u.active) return { html: esc(progress) + ' …', error: false };
    if (u.failed.length) {
      return {
        html: esc(progress) + '. ' + (u.failed.length === 1 ? 'Et billede' : u.failed.length + ' billeder') + ' kunne ikke gemmes: ' + esc(u.failed[0].message) +
          ' <button class="link-btn" type="button" data-action="photo-retry">Prøv igen</button>',
        error: true
      };
    }
    return { html: esc(u.total === 1 ? '1 billede gemt.' : u.total + ' billeder gemt.'), error: false };
  }
  function showUploadStatus(key) {
    var el = $('photoStatus');
    if (!el || !onCarPage(key)) return;
    var s = uploadStatus(key);
    el.className = 'photo-status' + (s.error ? ' error' : '');
    el.innerHTML = s.html;
  }

  function carInfoHtml(car) {
    if (!newServer()) {
      return '<h3>Udstyr, fejl og billeder</h3><div class="card"><p class="empty">' + NEEDS_NEW_SERVER + '. Serveren skal opdateres, før udstyr, fejl og mangler, noter og billeder kan bruges her.</p></div>';
    }
    if (!carRef(car)) return '';
    var info = ensureCarInfo(car);
    if (info.loading) return '<div class="loading"><span class="spinner"></span> Henter udstyr, fejl og noter …</div>';
    if (info.error) {
      return '<div class="banner error" role="alert" style="margin-top:20px"><span>' + esc(info.error) + '</span><button class="secondary" type="button" data-action="info-retry">Prøv igen</button></div>';
    }
    var html = '<h3>Udstyr' + (info.equipment.length ? ' (' + info.equipment.length + ')' : '') + '</h3><div class="card info">';
    html += info.equipment.length
      ? info.equipment.map(function (e) { return '<div class="info-row"><span class="info-text">' + esc(e.name) + '</span>' + trashButton('eq-del', e.id, e.name) + '</div>'; }).join('')
      : '<p class="empty">Der er ikke skrevet noget udstyr på bilen endnu.</p>';
    html += '<form class="info-add" id="eqForm" novalidate><input type="text" id="eqNew" data-key="eqNew" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Nyt udstyr, fx anhængertræk" aria-label="Nyt udstyr">' +
      '<button class="secondary" type="submit">Tilføj udstyr</button></form></div>';

    var open = info.defects.filter(function (d) { return !d.fixed; }).length;
    html += '<h3>Fejl og mangler' + (info.defects.length ? ' (' + open + ' åbne)' : '') + '</h3><div class="card info">';
    html += info.defects.length
      ? info.defects.map(function (d) {
        return '<div class="info-row' + (d.fixed ? ' fixed' : '') + '"><label class="check-item"><input type="checkbox" data-df-fix="' + esc(d.id) + '" data-key="df-' + esc(d.id) + '"' + (d.fixed ? ' checked' : '') +
          ' aria-label="Udbedret: ' + esc(d.text) + '"><span class="box">' + CHECK_SVG + '</span><span class="info-text">' + esc(d.text) + (d.photo ? ' <span class="pill">Billede</span>' : '') + '</span></label>' +
          trashButton('df-del', d.id, d.text) + '</div>';
      }).join('')
      : '<p class="empty">Ingen fejl eller mangler skrevet på bilen.</p>';
    var pic = S.dfPhoto && S.dfPhoto.key === car.key ? S.dfPhoto : null;
    html += '<form class="info-add" id="dfForm" novalidate><input type="text" id="dfNew" data-key="dfNew" maxlength="300" autocomplete="off" enterkeyhint="done" placeholder="Beskriv fejlen eller manglen" aria-label="Ny fejl eller mangel">' +
      '<label class="secondary photo-btn" id="dfPhotoBtn">' + (pic ? 'Billede valgt ✓' : 'Billede') + '<input type="file" id="dfPhoto" accept="image/*" aria-label="Tag eller vælg et billede til fejlen"></label>' +
      '<button class="secondary" type="submit" id="dfAdd">Tilføj fejl</button>' +
      '<p class="form-error" id="dfError" role="alert" hidden style="flex-basis:100%;margin:2px 0 0"></p></form></div>';

    html += '<h3>Noter</h3>';
    var conflict = S.noteConflicts[car.key];
    if (conflict) {
      html += '<div class="banner warn" role="alert" style="flex-wrap:wrap"><span><b>Noten blev ændret af ' + esc(conflictBy(conflict.by)) + ', mens du skrev.</b> Den nye tekst vises nu. Din tekst blev ikke gemt: "' +
        esc(conflict.mine.length > 300 ? conflict.mine.slice(0, 297) + '…' : conflict.mine) + '"</span>' +
        '<span><button class="secondary" type="button" data-action="note-mine">Brug min tekst</button> <button class="secondary" type="button" data-action="note-dismiss">Behold den nye</button></span></div>';
    }
    html += '<div class="card info-note"><label class="label" for="carNote">Noter om bilen</label>' +
      '<textarea id="carNote" data-key="carNote" maxlength="20000" placeholder="Fx skader, aftaler eller hvad der mangler">' + esc(info.notes.text) + '</textarea>' +
      '<p class="note-state" id="noteState" aria-live="polite">Gemmes automatisk.</p></div>';

    var st = uploadStatus(car.key);
    html += '<h3>Billeder</h3><div class="card photo-box"><label class="primary photo-btn" style="display:flex">Tilføj billeder' +
      '<input type="file" id="carPhotos" accept="image/*" multiple aria-label="Tilføj billeder fra kameraet eller fotobiblioteket"></label>' +
      '<p class="photo-status' + (st.error ? ' error' : '') + '" id="photoStatus" role="status" aria-live="polite">' + st.html + '</p></div>';
    return html;
  }

  function currentCar() {
    var r = parseRoute();
    return r.name === 'bil' ? findCar(r.arg) : null;
  }

  /** Lægger en ændring af udstyr, fejl eller note i køen og viser den med det samme. */
  function saveInfo(car, patch) {
    var arg = Object.assign({}, carRef(car), { carKey: car.key, carReg: car.reg || '' }, patch);
    save('saveCarInfo', arg);
  }

  function addEquipment(car, name) {
    var info = ensureCarInfo(car);
    name = name.replace(/\s+/g, ' ').trim();
    // (udstyr er korte navne: dobbelte mellemrum samles)
    if (!name) return false;
    var dup = info.equipment.some(function (e) { return e.name.toLowerCase() === name.toLowerCase(); });
    if (dup) { toast('Det udstyr står allerede på bilen.'); return false; }
    var id = newItemId();
    info.equipment.push({ id: id, name: name, source: 'egen', updatedAt: Date.now() + S.skew, by: S.state.user, deleted: false });
    saveInfo(car, { equipment: [{ id: id, name: name }] });
    return true;
  }
  function addDefect(car, text, photo) {
    var info = ensureCarInfo(car);
    var id = newItemId();
    var now = Date.now() + S.skew;
    info.defects.push({ id: id, text: text, photo: photo || '', fixed: false, createdAt: now, updatedAt: now, by: S.state.user, deleted: false });
    saveInfo(car, { defects: [{ id: id, text: text, photo: photo || '' }] });
  }

  function saveNoteDraft() {
    clearTimeout(S.noteTimer);
    var d = S.noteDraft;
    S.noteDraft = null;
    if (!d) return;
    var car = findCar(d.key);
    var info = S.info[d.key];
    if (!car || !info || !carRef(car) || info.notes.text === d.text) return;
    var base = info.notesBase || 0;       // den seneste version af noten, serveren har bekræftet
    info.notes = { text: d.text, updatedAt: Date.now() + S.skew, by: S.state.user };
    saveInfo(car, { notes: d.text, notesBase: base });
    var queued = S.ops[S.ops.length - 1];
    if (queued && queued.arg.at) info.notes.updatedAt = queued.arg.at;
    var el = $('noteState');
    if (el && onCarPage(d.key)) el.textContent = 'Gemmer …';
  }

  // ---------- Billeder: skalering, upload og fremskridt ----------

  function decodeImage(file) {
    function viaImg() {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve({ source: img, width: img.naturalWidth, height: img.naturalHeight, close: function () { URL.revokeObjectURL(url); } }); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
        img.src = url;
      });
    }
    if (typeof createImageBitmap !== 'function') return viaImg();
    function wrap(bmp) { return { source: bmp, width: bmp.width, height: bmp.height, close: function () { if (bmp.close) bmp.close(); } }; }
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(wrap, function () {
      return createImageBitmap(file).then(wrap, viaImg);
    });
  }

  /** Skalerer til højst 2560 px på den længste side og gemmer som JPEG (kvalitet 0,85). HEIC fra iPhone bliver dermed til JPG. */
  function scaleToJpeg(file) {
    return decodeImage(file).then(function (img) {
      var scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';                       // gennemsigtige billeder (PNG) får hvid baggrund
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img.source, 0, 0, w, h);
      img.close();
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) { if (blob) resolve(blob); else reject(new Error('encode')); }, 'image/jpeg', PHOTO_QUALITY);
      });
    }).catch(function () { throw appError('Filen kunne ikke læses som et billede.', 'INPUT'); });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function () { reject(appError('Billedet kunne ikke læses.', 'INPUT')); };
      reader.readAsDataURL(blob);
    });
  }

  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  /** Sender ét billede. Ved netfejl prøves der igen op til to gange; samme uploadId gør, at et billede aldrig gemmes to gange. */
  function sendPhoto(ref, base64, uploadId, tries) {
    tries = tries || 0;
    return call('uploadPhoto', Object.assign({}, ref, { mime: 'image/jpeg', data: base64, uploadId: uploadId }), PHOTO_TIMEOUT_MS).catch(function (err) {
      if (err.retry && tries < 2) return wait(RETRY_MS * Math.pow(2, tries)).then(function () { return sendPhoto(ref, base64, uploadId, tries + 1); });
      throw err;
    });
  }

  function uploadFile(ref, file, uploadId) {
    return scaleToJpeg(file).then(blobToBase64).then(function (b64) { return sendPhoto(ref, b64, uploadId); });
  }

  function addPhotos(car, files) {
    var ref = carRef(car);
    if (!ref || !files.length) return;
    var u = S.uploads[car.key];
    if (!u || (!u.active && !u.failed.length)) u = S.uploads[car.key] = { ref: ref, total: 0, done: 0, active: false, queue: [], failed: [] };
    files.forEach(function (f) { u.queue.push({ file: f, id: newItemId() }); u.total++; });
    runUploads(car.key);
  }

  function runUploads(key) {
    var u = S.uploads[key];
    if (!u || u.active) return;
    u.active = true;
    showUploadStatus(key);
    (function next() {
      var item = u.queue.shift();
      if (!item) { u.active = false; showUploadStatus(key); return; }
      uploadFile(u.ref, item.file, item.id).then(function () {
        u.done++;
        showUploadStatus(key);
        next();
      }, function (err) {
        if (err.code === 'AUTH') { u.active = false; return; }
        item.message = err.message;
        u.failed.push(item);
        if (err.retry || err.code === 'SETUP') {
          // Forbindelsen svigter: resten prøves ikke nu, men står klar til "Prøv igen".
          u.queue.forEach(function (rest) { rest.message = err.message; u.failed.push(rest); });
          u.queue = [];
          u.active = false;
        }
        showUploadStatus(key);
        if (u.active) next();
      });
    })();
  }

  function retryPhotos(key) {
    var u = S.uploads[key];
    if (!u || u.active || !u.failed.length) return;
    u.queue = u.failed;
    u.failed = [];
    runUploads(key);
  }

  function photosBusy() { return Object.keys(S.uploads).some(function (k) { return S.uploads[k].active; }); }

  /** Henter bilens udstyr, fejl og note igen (fx når appen kommer i forgrunden), så ændringer fra Bilarkivet vises. */
  function refreshCarInfo(car) {
    var info = S.info[car.key];
    if (!info || info.loading || carOpPending(car.key)) return;
    call('getCarInfo', carRef(car)).then(function (res) {
      if (carOpPending(car.key)) return;
      var before = infoSignature(info);
      info.equipment = res.info.equipment; info.defects = res.info.defects; info.notes = res.info.notes; info.notesBase = res.info.notes.updatedAt;
      if (onCarPage(car.key) && before !== infoSignature(info)) render();
    }, function () { /* stille: det, der står på skærmen, er stadig det seneste kendte */ });
  }

  function removeInfoItem(kind, id) {
    var car = currentCar();
    var info = car && S.info[car.key];
    if (!info) return;
    var list = kind === 'equipment' ? info.equipment : info.defects;
    var item = list.filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    var index = list.indexOf(item);
    if (kind === 'equipment') info.equipment = info.equipment.filter(function (e) { return e.id !== id; });
    else info.defects = info.defects.filter(function (d) { return d.id !== id; });
    saveInfo(car, kind === 'equipment' ? { equipment: [{ id: id, deleted: true }] } : { defects: [{ id: id, deleted: true }] });
    render(true);
    toastUndo(kind === 'equipment' ? 'Udstyret er fjernet.' : 'Fejlen er slettet.', function () {
      var cur = S.info[car.key];
      if (!cur) return;
      var target = kind === 'equipment' ? cur.equipment : cur.defects;
      if (!target.some(function (x) { return x.id === id; })) target.splice(Math.min(index, target.length), 0, item);
      saveInfo(car, kind === 'equipment' ? { equipment: [{ id: id, restore: true }] } : { defects: [{ id: id, restore: true }] });
      if (onCarPage(car.key)) render(true);
    });
  }

  function toggleDefect(el) {
    var car = currentCar();
    var info = car && S.info[car.key];
    if (!info) return;
    var id = el.getAttribute('data-df-fix');
    var d = info.defects.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    d.fixed = el.checked;
    d.updatedAt = Date.now() + S.skew;
    saveInfo(car, { defects: [{ id: id, fixed: d.fixed }] });
    render(true);
  }

  function dfError(text) {
    var el = $('dfError');
    if (!el) return;
    el.textContent = text;
    el.hidden = !text;
  }

  function submitDefect() {
    var car = currentCar();
    if (!car || !carRef(car)) return;
    var input = $('dfNew');
    var text = input.value.replace(/\s+/g, ' ').trim();
    dfError('');
    if (!text) { dfError('Skriv, hvad fejlen eller manglen er.'); input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
    input.removeAttribute('aria-invalid');
    var pic = S.dfPhoto && S.dfPhoto.key === car.key ? S.dfPhoto.file : null;
    if (!pic) {
      addDefect(car, text, '');
      render(true);
      if ($('dfNew')) $('dfNew').focus();
      return;
    }
    var btn = $('dfAdd');
    btn.disabled = true;
    btn.textContent = 'Gemmer billede …';
    uploadFile(carRef(car), pic, newItemId()).then(function (res) {
      S.dfPhoto = null;
      addDefect(car, text, res.path);
      render(true);
      if ($('dfNew')) $('dfNew').focus();
    }, function (err) {
      if (err.code === 'AUTH') return;
      var b = $('dfAdd');
      if (b) { b.disabled = false; b.textContent = 'Tilføj fejl'; }
      dfError(err.message + ' Fejlen er ikke tilføjet.');
    });
  }

  function submitEquipment() {
    var car = currentCar();
    if (!car || !carRef(car)) return;
    var input = $('eqNew');
    if (!input.value.trim()) { input.focus(); return; }
    addEquipment(car, input.value);
    render(true);
    if ($('eqNew')) $('eqNew').focus();
  }

  // ---------- Ny bil ----------

  function newCarState() {
    return { step: 'plate', reg: '', busy: false, error: '', fieldError: '', existing: null, lookedUp: false, equipmentError: '', nextInspection: '',
      f: { model: '', year: '', firstReg: '', fuel: '', color: '', vin: '', km: '' }, equip: [], notes: '' };
  }
  function openNewCar() {
    if (!newServer()) { toast(NEEDS_NEW_SERVER + '.', true); return; }
    S.newCar = newCarState();
    go('#/ny-bil');
  }

  function isoToDa(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '-' + m[2] + '-' + m[1] : (iso || '');
  }

  function viewNewCar() {
    if (!newServer()) {
      return '<a class="back" href="#/biler">' + ICONS.back + 'Biler</a><h1>Ny bil</h1><div class="banner warn" role="status"><span><b>' + NEEDS_NEW_SERVER + '.</b> Serveren skal opdateres, før en bil kan oprettes fra telefonen.</span></div>';
    }
    var n = S.newCar || (S.newCar = newCarState());
    return n.step === 'plate' ? viewPlateStep(n) : viewNewCarForm(n);
  }

  function viewPlateStep(n) {
