    var html = '<a class="back" href="#/biler">' + ICONS.back + 'Biler</a><div class="head"><div><h1>Ny bil</h1>' +
      '<p class="muted">Skriv nummerpladen. Så henter appen bilens oplysninger og udstyr fra registret.</p></div></div>';
    if (n.existing) {
      html += '<div class="banner" role="status"><span><b>' + (n.existing.kind === 'archive' ? 'Bilen findes allerede i Bilarkivet.' : 'Bilen er allerede oprettet og venter på Bilarkivet.') + '</b> ' +
        esc(n.existing.model) + '</span><button class="secondary" type="button" data-action="nc-open">Åbn bilen</button></div>';
    }
    if (n.error) html += '<div class="banner error" role="alert"><span>' + esc(n.error) + '</span></div>';
    html += '<form class="card plate-card" id="plateForm" novalidate><label class="label" for="newReg">Nummerplade</label>' +
      '<div class="plate-input"><span class="plate-eu" aria-hidden="true">DK</span>' +
      '<input id="newReg" class="plate-field" data-key="newReg" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="10" placeholder="AB 12 345" value="' + esc(n.reg) + '"' + (n.busy ? ' disabled' : '') + '></div>' +
      '<div class="plate-actions"><button class="primary" type="submit" id="lookupBtn" data-key="lookupBtn"' + (n.busy ? ' disabled' : '') + '>' + (n.busy ? 'Slår op …' : 'Slå op') + '</button>' +
      '<button class="secondary" type="button" data-action="nc-manual"' + (n.busy ? ' disabled' : '') + '>Opret uden opslag</button></div></form>';
    return html;
  }

  function ncField(n, name, label, opts) {
    opts = opts || {};
    return '<div class="field' + (opts.wide ? ' wide' : '') + '"><label for="nc-' + name + '">' + label + '</label><input type="text" id="nc-' + name + '" data-nc="' + name + '" data-key="nc-' + name + '" value="' + esc(n.f[name]) + '"' +
      (opts.mode ? ' inputmode="' + opts.mode + '"' : '') + (opts.max ? ' maxlength="' + opts.max + '"' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + ' autocomplete="off"' +
      (n.fieldError === name ? ' aria-invalid="true"' : '') + (opts.help ? ' aria-describedby="nc-' + name + '-help"' : '') + '>' +
      (opts.help ? '<span class="item-help" id="nc-' + name + '-help">' + esc(opts.help) + '</span>' : '') + '</div>';
  }

  /** "Ved syn 15-06-2026: 60.000 km": kilometerstanden fra seneste syn. Den vises kun og bliver ikke bilens km-stand. */
  function motHelp(n) {
    if (n.motKm === null || n.motKm === undefined) return '';
    return 'Ved syn' + (n.motDate ? ' ' + isoToDa(n.motDate) : '') + ': ' + formatNumberDa(n.motKm) + ' km';
  }

  function ncEquipCount(n) { var c = n.equip.filter(function (e) { return e.checked; }).length; return c + (c === 1 ? ' valgt' : ' valgte'); }

  function viewNewCarForm(n) {
    var html = '<button class="back link-btn" type="button" data-action="nc-reset" style="color:var(--muted);margin-bottom:12px">' + ICONS.back + 'Anden nummerplade</button>' +
      '<div class="car-head">' + plate(n.reg, true) + '<h1>Ny bil</h1></div>' +
      '<p class="muted" style="margin:6px 0 16px">' + (n.lookedUp ? 'Oplysningerne er hentet fra registret. Ret dem, hvis noget er forkert.' : 'Der er ikke slået noget op. Udfyld oplysningerne selv.') + '</p>';
    if (n.error) html += '<div class="banner error" role="alert" id="ncError"><span>' + esc(n.error) + '</span></div>';
    if (n.equipmentError) html += '<div class="banner warn" role="status"><span>' + esc(n.equipmentError) + '</span></div>';
    html += '<section class="card" aria-label="Oplysninger"><div class="form-grid">' +
      ncField(n, 'model', 'Mærke og model', { wide: true, max: 120, ph: 'fx VW Golf 1.5 TSI Style' }) +
      ncField(n, 'year', 'Årgang', { mode: 'numeric', max: 4, ph: '2019' }) +
      ncField(n, 'firstReg', '1. registrering', { max: 10, ph: 'dd-mm-åååå' }) +
      ncField(n, 'fuel', 'Brændstof', { max: 40 }) +
      ncField(n, 'color', 'Farve', { max: 40 }) +
      ncField(n, 'vin', 'Stelnummer', { wide: true, max: 20 }) +
      ncField(n, 'km', 'Km-stand', { mode: 'decimal', max: 9, ph: '45.230', help: motHelp(n) }) +
      '</div></section>';
    html += '<section class="card sec" style="margin-top:16px"><div class="sec-head"><h2>Udstyr<span class="sec-count" id="ncEqCount">' + ncEquipCount(n) + '</span></h2></div>';
    html += n.equip.length
      ? '<ul class="items">' + n.equip.map(function (e, i) {
        return '<li><div class="item info-row" style="padding:2px 10px"><label class="check-item"><input type="checkbox" data-nc-eq="' + i + '" data-key="nc-eq-' + i + '"' + (e.checked ? ' checked' : '') + '><span class="box">' + CHECK_SVG + '</span>' +
          '<span class="info-text">' + esc(e.name) + '</span></label>' + (e.source === 'dmr' ? '' : '<button class="icon-btn danger" type="button" data-action="nc-eq-del" data-i="' + i + '" aria-label="Fjern ' + esc(e.name) + '" title="Fjern">' + ICONS.trash + '</button>') + '</div></li>';
      }).join('') + '</ul>'
      : '<p class="empty">' + (n.lookedUp ? 'Registret har ikke noget udstyr på bilen.' : 'Skriv det udstyr, bilen har.') + '</p>';
    html += '<form class="info-add" id="ncEqForm" novalidate><input type="text" id="ncEqNew" data-key="ncEqNew" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Tilføj udstyr, fx anhængertræk" aria-label="Tilføj udstyr">' +
      '<button class="secondary" type="submit">Tilføj udstyr</button></form></section>';
    html += '<div class="card note-card" style="margin-top:16px"><label class="label" for="nc-notes">Noter <span style="font-weight:400">(valgfri)</span></label>' +
      '<textarea id="nc-notes" data-nc="notes" data-key="nc-notes" maxlength="2000" placeholder="Fx skader eller aftaler">' + esc(n.notes) + '</textarea></div>';
    html += '<div class="finish"><div class="finish-hint">Bilen oprettes i Bilarkivets mappe på Google Drive.</div>' +
      '<button class="primary" type="button" id="createCarBtn" data-key="createCarBtn" data-action="create-car"' + (n.busy ? ' disabled' : '') + '>' + (n.busy ? 'Opretter …' : 'Opret bil') + '</button></div>';
    return html;
  }

  function lookupNow() {
    var n = S.newCar;
    if (!n || n.busy) return;
    var el = $('newReg');
    var reg = normalizeReg(el ? el.value : n.reg);
    n.reg = reg; n.error = ''; n.existing = null;
    if (!/^[A-Z0-9]{2,7}$/.test(reg)) {
      n.error = reg ? 'Nummerpladen ser forkert ud. En almindelig plade har 2 bogstaver og 5 tal, fx AB12345.' : 'Skriv nummerpladen.';
      render(true);
      if ($('newReg')) $('newReg').focus();
      return;
    }
    n.busy = true;
    render(true);
    call('lookupPlate', { reg: reg }).then(function (res) {
      n.busy = false;
      if (S.newCar !== n) return;
      if (res.existing) { n.existing = res.existing; render(true); return; }
      var c = res.car;
      // Km-standen står tom: den fra seneste syn er målt dengang og vises kun som hjælpetekst.
      n.f = { model: c.model, year: c.year, firstReg: isoToDa(c.firstReg), fuel: c.fuel, color: c.color, vin: c.vin, km: '' };
      n.nextInspection = c.nextInspection || '';
      n.variant = c.variant || '';
      n.motKm = c.motKm === undefined ? null : c.motKm;
      n.motDate = c.motDate || '';
      n.equip = res.equipment.map(function (e) { return { name: e.label || e.name, source: 'dmr', checked: true }; });
      n.equipmentError = res.equipmentError || '';
      n.lookedUp = true;
      n.step = 'form';
      render(true);
      window.scrollTo(0, 0);
    }, function (err) {
      n.busy = false;
      if (err.code === 'AUTH') return;
      n.error = err.message;
      if (S.newCar === n) { render(true); if ($('newReg')) $('newReg').focus(); }
    });
  }

  function manualNewCar() {
    var n = S.newCar;
    if (!n || n.busy) return;
    var reg = normalizeReg($('newReg') ? $('newReg').value : n.reg);
    n.reg = reg; n.error = ''; n.existing = null;
    if (!/^[A-Z0-9]{2,7}$/.test(reg)) {
      n.error = reg ? 'Nummerpladen ser forkert ud. En almindelig plade har 2 bogstaver og 5 tal, fx AB12345.' : 'Skriv nummerpladen.';
      render(true);
      if ($('newReg')) $('newReg').focus();
      return;
    }
    n.lookedUp = false; n.equip = []; n.equipmentError = ''; n.step = 'form';
    render(true);
    window.scrollTo(0, 0);
    if ($('nc-model')) $('nc-model').focus();
  }

  function createCarNow() {
    var n = S.newCar;
    if (!n || n.busy) return;
    var f = n.f;
    var problem = function (field, text) { n.error = text; n.fieldError = field; render(true); var el = $('nc-' + field); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } };
    n.error = ''; n.fieldError = '';
    if (!f.model.trim()) return problem('model', 'Skriv mærke og model.');
    if (f.year.trim() && !/^(19|20)\d{2}$/.test(f.year.trim())) return problem('year', 'Årgang skal være et årstal, fx 2019.');
    if (f.km.trim() && !isFinite(parseNumberLoose(f.km))) return problem('km', 'Km skal være et tal, fx 45.230.');
    var payload = {
      reg: n.reg, model: f.model, year: f.year, firstReg: f.firstReg, fuel: f.fuel, color: f.color, vin: f.vin, km: f.km.trim() ? parseNumberLoose(f.km) : null,
      nextInspection: n.nextInspection, variant: n.variant || '', motKm: n.motKm === undefined ? null : n.motKm, motDate: n.motDate || '', notes: n.notes,
      equipment: n.equip.filter(function (e) { return e.checked; }).map(function (e) { return { name: e.name, source: e.source }; })
    };
    n.busy = true;
    render(true);
    call('createCar', payload).then(function (res) {
      n.busy = false;
      if (res.ok) {
        S.newCar = null;
        setState(res.state);
        go('#/bil/' + encodeURIComponent(res.key));
        toast('Bilen er oprettet. Bilarkivet henter den, når pc\'en er åben.');
        return;
      }
      if (res.duplicate) {
        n.step = 'plate'; n.existing = res.duplicate; n.error = '';
        render(true);
        loadState(true);
        return;
      }
      problem(res.field || '', res.error);
    }, function (err) {
      n.busy = false;
      if (err.code === 'AUTH') return;
      n.error = err.message + (err.retry ? ' Bilen er ikke oprettet. Prøv igen, når der er forbindelse.' : '');
      if (S.newCar === n) { render(true); var el = $('ncError'); if (el) el.scrollIntoView({ block: 'center' }); }
    });
  }

  // ---------- Tjekliste ----------

  function viewRun(id) {
    var run = S.run && S.run.id === id ? S.run : null;
    if (!run) {
      if (S.runError && S.runErrorFor === id) {
        return '<a class="back" href="#/biler">' + ICONS.back + 'Biler</a><div class="banner error" role="alert"><span>' + esc(S.runError) +
          '</span><button class="secondary" type="button" data-action="retry-run">Prøv igen</button></div>';
      }
      refreshRun(id);
      return '<div class="loading"><span class="spinner"></span> Henter tjeklisten …</div>';
    }
    var open = run.status === STATUS.OPEN;
    var p = run.progress;
    var html = '<a class="back" href="#/bil/' + encodeURIComponent(keyOf(run)) + '">' + ICONS.back + esc(plateText(run.car.reg) || 'Bilen') + (run.car.model ? ' · ' + esc(run.car.model) : '') + '</a>';
    html += '<div class="car-head">' + plate(run.car.reg, true) + '<h1 id="runTitle">' + esc(run.procedureName) + '</h1></div>';
    html += '<div class="run-meta">' + statusPill(run.status) + '<span>Startet ' + esc(fmtWhen(run.startedAt)) + ' af ' + esc(personName(run.startedBy)) + '</span>' +
      (run.car.model ? '<span>' + esc(run.car.model) + '</span>' : '') + '</div>';

    if (run.status === STATUS.DONE) {
      html += '<div class="banner" style="margin-top:16px"><span><b>Gennemført</b> ' + esc(fmtWhen(run.finishedAt)) + ' af ' + esc(personName(run.finishedBy)) +
        '. Tjeklisten er gemt og kan ikke ændres.</span><button class="secondary no-print" type="button" data-action="print">Udskriv</button></div>';
    } else if (run.status === STATUS.CANCELLED) {
      html += '<div class="banner warn" style="margin-top:16px"><span><b>Annulleret</b> ' + esc(fmtWhen(run.finishedAt)) + ' af ' + esc(personName(run.finishedBy)) + '.</span></div>';
    }

    if (open) {
      html += '<div class="progress" id="progress"><div class="progress-line"><span id="progressText">' + progressLabel(p) + '</span>' +
        '<span class="save-wrap" aria-live="polite"><button type="button" class="' + saveStateClass() + '" id="saveState" data-action="retry-save" title="' + esc(saveStateTitle()) + '"' + (saveStateActive() ? '' : ' disabled') + '>' + saveStateText() + '</button></span></div>' +
        '<div class="bar" role="progressbar" aria-label="Udfyldt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct(p) + '"><span id="progressBar" style="width:' + pct(p) + '%"></span></div></div>';
    } else {
      html += '<div style="height:16px"></div>';
    }

    run.sections.forEach(function (section) { html += sectionHtml(run, section, open); });

    if (open) {
      html += '<div class="card note-card"><label class="label" for="runNote">Note <span style="font-weight:400">(valgfri)</span></label>' +
        '<textarea id="runNote" data-key="runNote" maxlength="2000" placeholder="Fx aftaler med kunden. Skriv ikke CPR- eller kørekortnummer.">' + esc(run.note) + '</textarea></div>';
      html += '<div class="finish"><div class="finish-hint" id="finishHint">' + finishHint(p) + '</div>' +
        '<button class="primary" type="button" id="finishBtn" data-key="finishBtn" data-action="finish-run"' + (p.missing.length || S.finishing ? ' disabled' : '') + '>Afslut tjekliste</button></div>' +
        '<p class="cancel-line"><button class="link-btn danger" type="button" data-action="cancel-run" data-key="cancelRun">Annullér tjekliste</button></p>';
    } else if (run.note) {
      html += '<div class="card note-card"><span class="label">Note</span><p>' + esc(run.note) + '</p></div>';
    }
    return html;
  }

  function progressLabel(p) {
    return p.required ? '<b>' + p.done + ' af ' + p.required + '</b> påkrævede punkter' : '<b>' + p.answered + ' af ' + p.total + '</b> punkter';
  }
  function saveStateText() {
    if (S.pending && S.netDown) return 'Ikke gemt endnu';   // kort, så linjen aldrig skifter højde; hele teksten står i title
    if (S.pending) return 'Gemmer …';
    if (S.saveFailed) return 'Ikke gemt';
    return 'Alt er gemt';
  }
  function finishHint(p) {
    if (!p.missing.length) return 'Alle påkrævede punkter er udfyldt.';
    var first = p.missing[0];
    var go = ' type="button" data-action="goto-item" data-item="' + esc(first.itemId) + '"';
    return '<span class="hint-long">Mangler ' + (p.missing.length === 1 ? '1 punkt' : p.missing.length + ' punkter') + ': ' +
      '<button class="link-btn"' + go + '>' + esc(first.text) + '</button>' + (p.missing.length > 1 ? ' m.fl.' : '') + '</span>' +
      '<span class="hint-short"><button class="link-btn"' + go + ' aria-label="Gå til det første punkt, der mangler">' + p.missing.length + ' mangler</button></span>';
  }
  /** Teksten er kun en knap, når der er noget at prøve igen. */
  function saveStateActive() { return !!(S.pending && S.netDown); }
  /** Hele forklaringen til "Ikke gemt endnu" (hjælpetekst og besked i banneret). */
  function saveStateTitle() {
    if (!(S.pending && S.netDown)) return '';
    var one = S.ops.length === 1;
    var waiting = one ? '1 ændring venter' : S.ops.length + ' ændringer venter';
    return S.setupError
      ? 'Ikke gemt. ' + S.setupError + ' Tryk for at prøve nu.'
      : 'Ikke gemt endnu. ' + waiting + ' på forbindelsen. ' + (one ? 'Den bliver gemt' : 'De bliver gemt') + ', så snart den er tilbage – luk ikke appen, før det er sket. Tryk for at prøve nu.';
  }
  function saveStateClass() { return 'save-state' + ((S.saveFailed && !S.pending) || (S.pending && S.netDown) ? ' error' : ''); }

  function sectionHtml(run, section, open) {
    var skip = run.skipped[section.id];
    var countDone = section.items.filter(function (it) { return isAnswered(it, run.answers[it.id]); }).length;
    var html = '<section class="card sec" id="sec-' + esc(section.id) + '" aria-labelledby="sech-' + esc(section.id) + '"><div class="sec-head"><h2 id="sech-' + esc(section.id) + '">' +
      esc(section.title) + (skip ? '' : '<span class="sec-count">' + countDone + '/' + section.items.length + '</span>') + '</h2>';
    if (section.optional && open) {
      html += '<button class="skip-btn" type="button" data-action="skip" data-section="' + esc(section.id) + '" data-key="skip-' + esc(section.id) + '" aria-pressed="' + (skip ? 'true' : 'false') + '">' +
        (skip ? '✓ ' : '') + esc(section.skipLabel) + '</button>';
    }
    html += '</div>';
    if (skip) {
      return html + '<p class="skipped-note">Markeret som "' + esc(section.skipLabel) + '" ' + esc(fmtWhen(skip.at)) + ' af ' + esc(personName(skip.by)) + '.</p></section>';
    }
    html += '<ul class="items">' + section.items.map(function (item) { return '<li>' + itemHtml(run, item, open) + '</li>'; }).join('') + '</ul>';
    return html + '</section>';
  }

  function whoLine(a) {
    return a ? '<span class="item-who">' + esc(personName(a.by)) + ' · ' + esc(fmtWhen(a.at)) + '</span>' : '';
  }

  function itemHtml(run, item, open) {
    var a = run.answers[item.id];
    var answered = isAnswered(item, a);
    var opt = item.required ? '' : '<span class="opt-tag">valgfrit</span>';
    var help = item.help ? '<span class="item-help">' + esc(item.help).replace(/\n/g, '<br>') + '</span>' : '';
    var key = 'item-' + item.id;
    var aid = 'it-' + esc(item.id);

    if (item.type === 'check') {
      return '<label class="item check-item" id="' + aid + '"><input type="checkbox" data-item="' + esc(item.id) + '" data-key="' + esc(key) + '"' +
        (answered ? ' checked' : '') + (open ? '' : ' disabled') + '><span class="box">' + CHECK_SVG + '</span>' +
        '<span><span class="item-text">' + esc(item.text) + opt + '</span>' + help + (answered ? whoLine(a) : '') + '</span></label>';
    }

    var head = '<div class="item" id="' + aid + '"><span class="item-text" id="lbl-' + esc(item.id) + '">' + esc(item.text) + opt + '</span>' + help;
    if (!open) {
      var shown = answered ? (item.type === 'number' ? formatNumberDa(a.value) : String(a.value)) : '';
      return head + '<div class="readonly-answer' + (answered ? '' : ' none') + '">' + (answered ? esc(shown).replace(/\n/g, '<br>') : 'Ikke udfyldt') + '</div>' +
        (answered ? whoLine(a) : '') + '</div>';
    }
    var control = '';
    if (item.type === 'yesno' || item.type === 'choice') {
      var options = item.type === 'yesno' ? ['Ja', 'Nej'] : item.options;
      control = '<div class="opts" role="group" aria-labelledby="lbl-' + esc(item.id) + '">' + options.map(function (o, i) {
        var on = answered && a.value === o;
        return '<button class="opt" type="button" aria-pressed="' + on + '" data-action="pick" data-item="' + esc(item.id) + '" data-value="' + esc(o) + '" data-key="' + esc(key + '-' + i) + '">' + esc(o) + '</button>';
      }).join('') + '</div>';
    } else if (item.type === 'number') {
      control = '<input type="text" inputmode="decimal" class="num-input" data-item="' + esc(item.id) + '" data-key="' + esc(key) + '" aria-labelledby="lbl-' + esc(item.id) + '" value="' +
        esc(answered ? formatNumberDa(a.value) : '') + '" autocomplete="off">';
    } else {
      control = '<textarea data-item="' + esc(item.id) + '" data-key="' + esc(key) + '" aria-labelledby="lbl-' + esc(item.id) + '" maxlength="500" rows="2">' + esc(answered ? a.value : '') + '</textarea>';
    }
    return head + '<div class="answer">' + control + '</div>' + (answered ? whoLine(a) : '') + '</div>';
  }

  /** Opdaterer fremdrift og afslut-knappen uden at tegne hele siden. */
  function refreshRunChrome() {
    if (!S.run) return;
    var p = S.run.progress;
    var t = $('progressText'); if (t) t.innerHTML = progressLabel(p);
    var b = $('progressBar'); if (b) { b.style.width = pct(p) + '%'; b.parentNode.setAttribute('aria-valuenow', pct(p)); }
    var s = $('saveState'); if (s) { s.textContent = saveStateText(); s.className = saveStateClass(); s.title = saveStateTitle(); s.disabled = !saveStateActive(); }
    var h = $('finishHint'); if (h) h.innerHTML = finishHint(p);
    var f = $('finishBtn'); if (f) f.disabled = p.missing.length > 0 || S.finishing === true;
  }

  function refreshRun(id) {
    if (S.loadingRun === id) return;
    S.loadingRun = id;
    call('openChecklist', id).then(function (res) {
      S.loadingRun = null;
      S.runError = '';
      if (S.pending) return; // nyere ændringer er på vej
      S.saveFailed = false;  // skærmen viser nu det, der faktisk er gemt
      S.run = res.run;
      updateSummary(res.run);
      if (parseRoute().arg === id) render();
    }, function (err) {
      S.loadingRun = null;
      if (err.code === 'AUTH') return;
      if (S.run && S.run.id === id) { toast(err.message, true); return; }
      S.runError = err.message;
      S.runErrorFor = id;
      if (parseRoute().arg === id) render();
    });
  }

  /**
   * Ændringen er allerede vist på skærmen. Gemningerne ligger i en kø og sendes én ad gangen,
   * så de rammer regnearket i samme rækkefølge, som de blev lavet. Svigter forbindelsen, bliver
   * ændringen i køen (og på enheden) og sendes igen, til serveren har bekræftet den. Kun hvis
   * serveren selv afviser en ændring, hentes det gemte fra serveren igen.
   */
  function save(name, arg) {
    // Tidspunktet for ændringen følger med, så serveren gemmer, hvornår den blev lavet (ikke hvornår den nåede frem),
    // og så en gammel ændring ikke overskriver en nyere af samme punkt.
    // Altid højere end forrige ændring: urforskellen svinger lidt med svartiden, og to tryk på samme punkt må aldrig
    // få tidspunkter i omvendt rækkefølge (så den anden ville blive afvist som "ændret senere" af en selv).
    // lastAt bruges kun, når det ligger lidt foran (op til 10 s): et tidspunkt langt ude i fremtiden (fx fra et ur, der
    // har gået forkert) må ikke holde alle senere ændringer væk fra det rigtige tidspunkt.
    var base = Date.now() + S.skew;
    var at = (S.lastAt >= base && S.lastAt - base < 10000) ? S.lastAt + 1 : base;
    S.lastAt = at;
    store.set(LASTAT_STORE, String(at));
    S.ops.push({ name: name, arg: Object.assign({}, arg, { at: at }) });
    S.pending = S.ops.length;
    persistOps();
    refreshRunChrome();
    flush();
  }

  function persistOps() {
    if (S.ops.length) store.set(OPS_STORE, JSON.stringify(S.ops)); else store.remove(OPS_STORE);
  }
  function loadStoredOps() {
    var list;
    try { list = JSON.parse(store.get(OPS_STORE) || '[]'); } catch (e) { list = []; }
    if (!Array.isArray(list)) return [];
    return list.filter(function (op) {
      if (!op || QUEUED[op.name] !== true || !op.arg) return false;
      return op.name === 'saveCarInfo' ? typeof op.arg.carKey === 'string' && !!(op.arg.archiveId || op.arg.pendingId) : typeof op.arg.runId === 'string';
    })
      .map(function (op) { return { name: op.name, arg: op.arg }; });
  }

  /** Sender den første ændring i køen. now = true prøver igen med det samme, i stedet for at vente. */
  function flush(now) {
    if (S.sending || !S.ops.length || !S.key) return;
    if (S.retryTimer && !now) return;       // venter på næste forsøg
    clearTimeout(S.retryTimer);
    S.retryTimer = 0;
    S.sending = true;
    var op = S.ops[0];
    var isCar = op.name === 'saveCarInfo';
    var runId = isCar ? '' : op.arg.runId;
    call(op.name, op.arg).then(function (res) {
      S.sending = false;
      S.ops.shift();
      S.pending = S.ops.length;
      persistOps();
      var wasDown = S.netDown;
      S.netDown = false;
      S.setupError = '';
      S.retries = 0;
      if (isCar) {
        carSaved(op, res);
        refreshRunChrome();
        updateSync();
        if (S.ops.length) flush(); else settle(true);
        return;
      }
      updateSummary(res.run);
      if (res.skipped) {
        // Punktet er ændret senere (fx på en anden enhed): serveren beholdt den nyere ændring.
        var what = op.name === 'saveChecklistNote' ? 'Noten' : op.name === 'skipChecklistSection' ? 'Afsnittet' : 'Punktet';
        toast(what + ' blev ændret senere' + (res.by ? ' af ' + personName(res.by) : '') + ' – din ændring blev ikke gemt.', true);
        if (S.run && S.run.id === runId) {
          if (S.pending) mergeStale(op, res.run);   // andre ændringer venter: kun det sprungne ændres, resten står som det er
          else S.run = res.run;
          render();
        }
      }
      if (!S.pending && S.run && S.run.id === runId) {
        S.saveFailed = false;
        var changed = runSignature(res.run) !== runSignature(S.run);
        S.run = res.run;
        if (changed) render(); else refreshRunChrome();
      } else if (wasDown) {
        refreshRunChrome();
      }
      updateSync();
      if (S.ops.length) flush(); else settle(true);
    }, function (err) {
      S.sending = false;
      if (err.code === 'AUTH') return;      // authLost() har allerede ryddet op
      if (err.code === 'SETUP') {
        // Serveren er sat forkert op: det hjælper ikke at prøve igen af sig selv. Ændringerne bliver liggende.
        S.netDown = true;
        if (!S.setupError) toast(err.message, true);
        S.setupError = err.message;
        // Prøver langsomt igen af sig selv, for en midlertidig fejlside fra Google kan ligne en login-side.
        S.retryTimer = setTimeout(function () { S.retryTimer = 0; flush(); }, SETUP_RETRY_MS);
        refreshRunChrome();
        updateSync();
        settle(false);
        return;
      }
      if (err.retry) {
        S.setupError = '';
        S.netDown = true;
        S.retries++;
        S.retryTimer = setTimeout(function () { S.retryTimer = 0; flush(); }, Math.min(RETRY_MS * Math.pow(2, S.retries - 1), 30000));
        refreshRunChrome();
        updateSync();
        settle(false);
        return;
      }
      // Serveren har afvist ændringen (fx fordi tjeklisten er afsluttet af en anden).
      S.ops.shift();
      S.pending = S.ops.length;
      persistOps();
      S.netDown = false;
      S.saveFailed = true;
      toast('Ændringen blev ikke gemt: ' + err.message, true);
      if (isCar) {
        delete S.info[op.arg.carKey];     // hent det, der faktisk er gemt
        if (onCarPage(op.arg.carKey)) render();
      } else if (!S.pending && S.run && S.run.id === runId) {
        S.run = null;           // hent det, der faktisk er gemt
        refreshRun(runId);
        render();
      }
      updateSync();
      if (S.ops.length) flush(); else settle(true);
    });
  }

  /** En ændring af udstyr, fejl eller note er gemt. Er der ikke flere ændringer på vej for bilen, vises det, serveren har. */
  function conflictBy(by) { return !by || by === 'Bilarkiv' ? 'Bilarkivet' : personName(by); }
  function persistNoteConflicts() {
    if (Object.keys(S.noteConflicts).length) store.set('procedurer.noteConflicts', JSON.stringify(S.noteConflicts)); else store.remove('procedurer.noteConflicts');
  }

  function carSaved(op, res) {
    var key = op.arg.carKey;
    var info = S.info[key];
    if (res.noteConflict) {
      // Noten er ændret af en anden, mens du skrev: den nye tekst vises, og din bliver stående, så intet går tabt.
      // Serveren gemte ikke noten. Følgende note-ændringer i køen bygger på samme gamle version og ville ramme samme konflikt: de tages ud
      // af køen (andre ændringer i dem beholdes), og den nyeste tekst står i beskeden, så banneret passer til det, der faktisk er gemt.
      var mine = String(op.arg.notes || '');
      S.ops.forEach(function (o) {
        if (o.name === 'saveCarInfo' && o.arg.carKey === key && o.arg.notes !== undefined) { mine = String(o.arg.notes); delete o.arg.notes; delete o.arg.notesBase; }
      });
      S.ops = S.ops.filter(function (o) { return !(o.name === 'saveCarInfo' && o.arg.carKey === key && o.arg.notes === undefined && !o.arg.equipment && !o.arg.defects); });
      S.pending = S.ops.length;
      persistOps();
      // Også når bilen ikke er åbnet (fx køen sendes ved opstart): konflikten gemmes pr. bil og vises, når bilen åbnes.
      S.noteConflicts[key] = { mine: mine, by: res.info.notes.by || '', reg: op.arg.carReg || '' };
      persistNoteConflicts();
      if (info) {
        info.equipment = res.info.equipment; info.defects = res.info.defects; info.notes = res.info.notes; info.notesBase = res.info.notes.updatedAt;
      }
      var plateReg = op.arg.carReg || (S.state && findCar(key) ? findCar(key).reg : '');
      toast('Noten til ' + (plateReg ? plateText(plateReg) : 'bilen') + ' blev ændret af ' + conflictBy(res.info.notes.by) + ', mens du skrev. Din tekst blev ikke gemt. Åbn bilen for at se den.', true);
      if (onCarPage(key)) render();
      return;
    }
    if (res.skipped && res.skipped.some(function (id) { return id !== 'notes'; })) toast('Noget er ændret i Bilarkivet, mens du arbejdede. Din ændring blev ikke gemt.', true);
    if (op.arg.notes !== undefined && onCarPage(key) && $('noteState') && !(res.skipped && res.skipped.indexOf('notes') >= 0)) $('noteState').textContent = 'Gemt.';
    if (info) info.notesBase = res.info.notes.updatedAt;
    if (!info || carOpPending(key)) return;
    var before = infoSignature(info);
    info.equipment = res.info.equipment;
    info.defects = res.info.defects;
    info.notes = res.info.notes; info.notesBase = res.info.notes.updatedAt;
    if (onCarPage(key) && before !== infoSignature(info)) render();
  }
  function infoSignature(info) { return JSON.stringify([info.equipment.map(function (e) { return [e.id, e.name]; }), info.defects.map(function (d) { return [d.id, d.text, d.fixed, d.photo]; }), info.notes.text]); }

  /** Henter kun det, serveren beholdt for den sprungne ændring, ind i den viste tjekliste. Ventende ændringer forsvinder ikke fra skærmen. */

  function mergeStale(op, serverRun) {
    var a = op.arg, key;
    if (op.name === 'saveChecklistNote') { key = 'note'; S.run.note = serverRun.note; }
    else if (op.name === 'skipChecklistSection') {
      key = 'sec:' + a.sectionId;
      if (serverRun.skipped[a.sectionId]) S.run.skipped[a.sectionId] = serverRun.skipped[a.sectionId]; else delete S.run.skipped[a.sectionId];
    } else {
      key = a.itemId;
      if (serverRun.answers[a.itemId]) S.run.answers[a.itemId] = serverRun.answers[a.itemId]; else delete S.run.answers[a.itemId];
    }
    if (serverRun.changed && serverRun.changed[key] !== undefined) { S.run.changed = S.run.changed || {}; S.run.changed[key] = serverRun.changed[key]; }
    S.run.progress = progressOf(S.run);
  }

  /** Giver dem, der venter på, at køen bliver tom, besked: true = alt er gemt, false = det kan ikke lige nu. */
  function settle(saved) {
    var list = S.waiters;
    S.waiters = [];
    list.forEach(function (fn) { fn(saved); });
    if (saved && S.resumed && !S.ops.length) {
      S.resumed = 0;
      if (!Object.keys(S.noteConflicts).length) toast('Ændringer fra sidst er nu gemt.');   // ellers står beskeden om noten, som ikke blev gemt, tilbage

      if (S.key) loadState(true);
    }
  }
  function whenSaved() {
    return new Promise(function (resolve) {
      if (!S.ops.length) resolve(true);
      else if (S.netDown) resolve(false);
      else S.waiters.push(resolve);
    });
  }

  /** Den faste besked øverst, når ændringer ikke er nået frem. */
  function updateSync() {
    // Ikke på tjeklistesiden: der viser fremdriftslinjen allerede status ("Ikke gemt endnu", tryk for at prøve nu),
    // og et banner dér ville skubbe punkterne ned midt i et tryk.
    var show = !!S.key && S.netDown && S.ops.length > 0 && parseRoute().name !== 'tjekliste';
    $('sync').hidden = !show;
    if (show) {
      var one = S.ops.length === 1;
      var waiting = one ? '1 ændring venter' : S.ops.length + ' ændringer venter';
      var longText = S.setupError
        ? 'Ikke gemt. ' + S.setupError
        : 'Ikke gemt endnu. ' + waiting + ' på forbindelsen. ' + (one ? 'Den bliver gemt' : 'De bliver gemt') + ', så snart den er tilbage – luk ikke appen, før det er sket.';
      // Én linje: kort tekst, hele teksten som hjælpetekst (og efter tryk på tekstens linje i en meddelelse).
      $('syncText').textContent = S.setupError ? 'Ikke gemt · ' + S.setupError : 'Ikke gemt endnu · ' + waiting;
      $('syncText').title = longText;
      $('syncText').setAttribute('data-full', longText);
    }
  }

  /** Det, der ses på skærmen – tidspunkter fra telefonen og serveren kan afvige en smule. */
  function runSignature(run) {
    var values = {};
    Object.keys(run.answers).sort().forEach(function (k) { values[k] = run.answers[k].value; });
    return JSON.stringify([values, Object.keys(run.skipped).sort(), run.status, run.note]);
  }

  function localAnswer(itemId, value) {
    var found = null;
    S.run.sections.forEach(function (s) { s.items.forEach(function (it) { if (it.id === itemId) found = it; }); });
    if (!found) return;
    if (value === null || value === '' || value === false) delete S.run.answers[itemId];
    else S.run.answers[itemId] = { value: value, at: Date.now(), by: S.state.user };
    S.run.progress = progressOf(S.run);
  }

  function setAnswer(itemId, value) {
    if (!S.run || S.run.status !== STATUS.OPEN) return;
    localAnswer(itemId, value);
    save('answerChecklistItem', { runId: S.run.id, itemId: itemId, value: value });
  }

  function finishCurrentRun() {
    var run = S.run;
    if (!run || S.finishing) return;
    var noteEl = $('runNote');
    var note = noteEl ? noteEl.value : run.note;
    if (S.netDown && S.ops.length) { toast('Ændringerne er ikke gemt endnu. Vent, til der er forbindelse igen.', true); return; }
    confirmBox('Afslut tjeklisten?', 'Den bliver gemt med dato, tidspunkt og dit navn og kan ikke rettes bagefter.', 'Afslut', false).then(function (ok) {
      if (!ok) return;
      S.finishing = true;
      var btn = $('finishBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Afslutter …'; }
      function restore() {
        S.finishing = false;
        var b = $('finishBtn');
        if (b) { b.textContent = 'Afslut tjekliste'; refreshRunChrome(); }
      }
      whenSaved().then(function (saved) {
        if (!saved) throw appError('Ændringerne er ikke gemt endnu. Prøv igen, når der er forbindelse.', 'SERVER', true);
        return call('finishChecklist', { runId: run.id, note: note, noteAt: (S.run && S.run.changed && S.run.changed.note) || 0 });
      }).then(function (res) {
        S.finishing = false;
        setState(res.state);
        S.run = res.run;
        render();
        window.scrollTo(0, 0);
        toast('Tjeklisten er gennemført og gemt.');
      }, function (err) {
        if (err.code === 'AUTH') return;
        toast(err.message, true);
        restore();
        if (err.retry) return;   // uden forbindelse: behold det, der står på skærmen
        S.run = null;
        refreshRun(run.id);
        render();
      });
    });
  }

  function cancelCurrentRun() {
    var run = S.run;
    if (!run) return;
    confirmBox('Annullér tjeklisten?', 'Den bliver stående i historikken som annulleret. Du kan starte en ny bagefter.', 'Annullér tjeklisten', true).then(function (ok) {
      if (!ok) return;
      whenSaved().then(function (saved) {
        if (!saved) throw appError('Ændringerne er ikke gemt endnu. Prøv igen, når der er forbindelse.', 'SERVER', true);
        return call('cancelChecklist', { runId: run.id });
      }).then(function (res) {
        setState(res.state);
        S.run = res.run;
        go('#/bil/' + encodeURIComponent(keyOf(res.run)));
        toast('Tjeklisten er annulleret.');
      }, function (err) { if (err.code !== 'AUTH') toast(err.message, true); });
    });
  }

  function startRun(btn) {
    var procId = btn.getAttribute('data-proc');
    var car = findCar(btn.getAttribute('data-car'));
    if (!car) return;
    var proc = S.state.procedures.filter(function (p) { return p.id === procId; })[0];
    var go2 = function () {
      var arg = car.inArchive ? { procedureId: procId, archiveId: car.archiveId } : { procedureId: procId, manual: { reg: car.reg, model: car.model } };
      btn.disabled = true;
      btn.textContent = 'Starter …';
      call('startChecklist', arg).then(function (res) {
        setState(res.state);
        S.run = res.run;
        if (!car.inArchive) delete S.manualCars[car.key];
        go('#/tjekliste/' + encodeURIComponent(res.run.id));
        if (res.existing) toast('Der var allerede en ' + proc.name.toLowerCase() + ' i gang. Den er åbnet.');
      }, function (err) {
        if (err.code === 'AUTH') return;
        btn.disabled = false;
        btn.textContent = btn.getAttribute('data-again') ? 'Start igen' : 'Start ' + proc.name.toLowerCase();
        toast(err.message, true);
      });
    };
    if (btn.getAttribute('data-again')) {
      confirmBox('Start ' + proc.name.toLowerCase() + ' igen?', proc.name + ' er allerede gennemført på bilen. Den gamle tjekliste bliver stående i historikken.', 'Start igen', false)
        .then(function (ok) { if (ok) go2(); });
    } else {
      go2();
    }
  }

  // ---------- Historik ----------

  function viewHistory() {
    var h = S.hist;
    var procs = S.state.procedures;
    var html = '<div class="head"><div><h1>Historik</h1><p class="muted">Alle tjeklister, nyeste først. Tryk på en for at se, hvad der blev udfyldt.</p></div></div>';
    html += '<div class="toolbar">' +
      '<input type="search" class="grow" id="histSearch" data-key="histSearch" placeholder="Søg på reg.nr., model eller note" aria-label="Søg i historik" value="' + esc(h.q) + '">' +
      '<select id="histProc" data-key="histProc" aria-label="Procedure" style="width:auto"><option value="">Alle procedurer</option>' +
      procs.map(function (p) { return '<option value="' + esc(p.id) + '"' + (h.proc === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select>' +
      '<select id="histStatus" data-key="histStatus" aria-label="Status" style="width:auto"><option value="">Alle</option>' +
      [STATUS.OPEN, STATUS.DONE, STATUS.CANCELLED].map(function (s) { return '<option' + (h.status === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>';
    return html + '<div id="histList">' + historyList() + '</div>';
  }

  function historyList() {
    var h = S.hist;
    var q = h.q.trim().toLowerCase();
    var runs = S.state.runs.filter(function (r) {
      if (h.proc && r.procedureId !== h.proc) return false;
      if (h.status && r.status !== h.status) return false;
      if (!q) return true;
      var hay = (normalizeReg(r.car.reg) + ' ' + r.car.model + ' ' + r.procedureName + ' ' + r.note).toLowerCase();
      return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0 || hay.indexOf(normalizeReg(w).toLowerCase()) >= 0; });
    });
    if (!runs.length) return '<div class="card"><p class="empty">' + (S.state.runs.length ? 'Ingen tjeklister passer til filteret.' : 'Der er ingen tjeklister endnu.') + '</p></div>';
    var html = '';
    var month = '';
    var shown = runs.slice(0, h.limit);
    shown.forEach(function (r) {
      var m = monthLabel(r.startedAt);
      if (m !== month) {
        if (month) html += '</ul></div>';
        month = m;
        html += '<h3>' + esc(m) + '</h3><div class="card"><ul class="list">';
      }
      html += runRow(r);
    });
    html += '</ul></div>';
    if (runs.length > shown.length) html += '<p style="text-align:center"><button class="secondary" type="button" data-action="more-history">Vis flere (' + (runs.length - shown.length) + ')</button></p>';
    return html;
  }

  // ---------- Procedurer ----------

  function viewProcedures() {
    var active = S.state.procedures.filter(function (p) { return p.status !== 'Arkiveret'; });
    var archived = S.state.procedures.filter(function (p) { return p.status === 'Arkiveret'; });
    function card(p) {
      var n = p.sections.reduce(function (s, x) { return s + x.items.length; }, 0);
      return '<li><div class="row"><span class="pill">' + esc(p.repeat === 'once' ? 'Én gang pr. bil' : 'Flere gange pr. bil') + '</span>' +
        '<span class="row-main"><span class="row-title">' + esc(p.name) + '</span><span class="row-sub">' +
        esc(p.sections.length + ' afsnit · ' + n + (n === 1 ? ' punkt' : ' punkter') + ' · version ' + p.version + (p.updatedAt ? ' · rettet ' + fmtDate(p.updatedAt) + ' af ' + personName(p.updatedBy) : '')) +
        '</span></span><span class="row-side">' +
        (p.status === 'Arkiveret'
          ? '<button class="link-btn" type="button" data-action="archive" data-id="' + esc(p.id) + '" data-archived="0">Gendan</button>'
          : '<a class="secondary" style="text-decoration:none" href="#/procedure/' + encodeURIComponent(p.id) + '">Redigér</a>') +
        '</span></div></li>';
    }
    var html = '<div class="head"><div><h1>Procedurer</h1><p class="muted">Faste tjeklister, der bruges på bilerne. Ret dem her – uden programmering.</p></div>' +
      '<a class="primary" style="text-decoration:none" href="#/procedure/ny">Ny procedure</a></div>' + problemsBanner();
    html += active.length ? '<div class="card"><ul class="list">' + active.map(card).join('') + '</ul></div>'
      : '<div class="card"><p class="empty">Der er ingen aktive procedurer.</p></div>';
    if (archived.length) {
      html += '<details class="more"><summary>Arkiverede (' + archived.length + ')</summary><div class="card"><ul class="list">' + archived.map(card).join('') + '</ul></div></details>';
    }
    return html;
  }

  // ---------- Redigering ----------

  function newKey() { S.keySeq++; return 'k' + S.keySeq; }
  function blankItem() { return { key: newKey(), id: '', text: '', help: '', type: 'check', required: true, optionsText: '', showHelp: false }; }
  function blankSection() { return { key: newKey(), id: '', title: '', optional: false, skipLabel: 'Ikke relevant', items: [blankItem()] }; }

  function editorFromProcedure(p) {
    return {
      id: p.id, version: p.version, status: p.status, name: p.name, description: p.description, repeat: p.repeat,
      sections: p.sections.map(function (s) {
        return {
          key: newKey(), id: s.id, title: s.title, optional: s.optional, skipLabel: s.skipLabel || 'Ikke relevant',
          items: s.items.map(function (it) {
            return { key: newKey(), id: it.id, text: it.text, help: it.help, type: it.type, required: it.required, optionsText: (it.options || []).join('\n'), showHelp: !!it.help };
          })
        };
      })
    };
  }

  function viewEditor(arg) {
    if (S.editorFor !== arg || !S.editor) {
      if (arg === 'ny') {
        S.editor = { id: '', version: 0, name: '', description: '', repeat: 'once', sections: [blankSection()] };
      } else {
        var p = S.state.procedures.filter(function (x) { return x.id === arg; })[0];
        if (!p) return '<a class="back" href="#/procedurer">' + ICONS.back + 'Procedurer</a><h1>Proceduren blev ikke fundet</h1>';
        S.editor = editorFromProcedure(p);
      }
      S.editorFor = arg;
      S.dirty = false;
      S.editorError = null;
    }
    var e = S.editor;
    var err = S.editorError;
    function inv(field) { return err && err.field === field ? ' aria-invalid="true"' : ''; }

    var html = '<a class="back" href="#/procedurer">' + ICONS.back + 'Procedurer</a>' +
      '<div class="head"><div><h1>' + (e.id ? 'Redigér procedure' : 'Ny procedure') + '</h1>' +
      (e.id ? '<p class="muted">Ændringer gælder nye tjeklister. Tjeklister, der allerede er i gang, beholder punkterne fra da de blev startet.</p>' : '') + '</div></div>';

    html += '<div class="card ed-top"><div class="field"><label for="edName">Navn</label><input id="edName" type="text" data-key="edName" data-bind="name" data-field="name" maxlength="80" value="' + esc(e.name) + '"' + inv('name') + ' placeholder="fx Klargøring af bil"></div>' +
      '<div class="field"><label for="edDesc">Beskrivelse <span style="font-weight:400">(valgfri)</span></label><input id="edDesc" type="text" data-key="edDesc" data-bind="description" data-field="description" maxlength="300" value="' + esc(e.description) + '"' + inv('description') + '></div>' +
      '<span class="label" id="repLabel">Bruges</span><div class="seg" role="group" aria-labelledby="repLabel" data-field="repeat">' +
      '<button type="button" data-action="repeat" data-value="many" data-key="rep-many" aria-pressed="' + (e.repeat === 'many') + '">Flere gange pr. bil</button>' +
      '<button type="button" data-action="repeat" data-value="once" data-key="rep-once" aria-pressed="' + (e.repeat === 'once') + '">Én gang pr. bil</button></div>' +
      '<p class="muted" style="font-size:13.5px;margin:8px 0 0">' + (e.repeat === 'many' ? 'Fx prøvekørsel: der kan laves en ny tjekliste hver gang.' : 'Fx klargøring: bilen viser, om den er gennemført.') + '</p></div>';

    e.sections.forEach(function (s, si) {
      var sp = 's' + si;
      html += '<section class="card ed-sec" aria-label="Afsnit ' + (si + 1) + '"><div class="ed-sec-head"><div class="field"><label for="t-' + s.key + '">Afsnit ' + (si + 1) + '</label>' +
        '<input id="t-' + s.key + '" type="text" data-key="t-' + s.key + '" data-bind="' + sp + '.title" data-field="' + sp + '.title" maxlength="80" value="' + esc(s.title) + '"' + inv(sp + '.title') + ' placeholder="fx Inden kørsel"></div>' +
        '<div class="ed-tools">' +
        '<button class="icon-btn" type="button" data-action="sec-up" data-s="' + si + '" data-key="su-' + s.key + '" aria-label="Flyt afsnit op"' + (si === 0 ? ' disabled' : '') + '>' + ICONS.up + '</button>' +
        '<button class="icon-btn" type="button" data-action="sec-down" data-s="' + si + '" data-key="sd-' + s.key + '" aria-label="Flyt afsnit ned"' + (si === e.sections.length - 1 ? ' disabled' : '') + '>' + ICONS.down + '</button>' +
        '<button class="icon-btn danger" type="button" data-action="sec-del" data-s="' + si + '" data-key="sx-' + s.key + '" aria-label="Slet afsnit"' + (e.sections.length === 1 ? ' disabled' : '') + '>' + ICONS.trash + '</button>' +
        '</div></div>';
      html += '<div class="ed-skip"><label class="tick"><input type="checkbox" data-bind="' + sp + '.optional" data-key="o-' + s.key + '"' + (s.optional ? ' checked' : '') + '> Afsnittet kan springes over</label>' +
        (s.optional ? '<input type="text" data-bind="' + sp + '.skipLabel" data-field="' + sp + '.skipLabel" data-key="sl-' + s.key + '" maxlength="40" value="' + esc(s.skipLabel) + '"' + inv(sp + '.skipLabel') + ' aria-label="Tekst på knappen" placeholder="Tekst på knappen, fx Kunden købte ikke">' : '') + '</div>';
      html += '<ol class="ed-items" data-field="' + sp + '.items">' + s.items.map(function (it, ii) { return editorItem(e, s, si, it, ii, inv); }).join('') + '</ol>';
      html += '<div class="ed-add"><button class="link-btn" type="button" data-action="item-add" data-s="' + si + '" data-key="ia-' + s.key + '">+ Tilføj punkt</button></div></section>';
    });

    html += '<div class="ed-add" data-field="sections"><button class="secondary" type="button" data-action="sec-add" data-key="sec-add">+ Tilføj afsnit</button></div>';
    html += '<div class="ed-actions"><span class="ed-error" id="edError" role="alert">' + (err ? esc(err.error) : '') + '</span>' +
      (e.id ? '<button class="link-btn danger" type="button" data-action="archive" data-id="' + esc(e.id) + '" data-archived="1">Arkivér</button>' : '') +
      '<a class="secondary" style="text-decoration:none" href="#/procedurer">Annullér</a>' +
      '<button class="primary" type="button" id="edSave" data-action="ed-save" data-key="edSave">Gem procedure</button></div>';
    return html;
  }

  function editorItem(e, s, si, it, ii, inv) {
    var ip = 's' + si + '.i' + ii;
    var html = '<li class="ed-item"><div class="ed-item-row"><div class="field"><label for="x-' + it.key + '">Punkt ' + (ii + 1) + '</label>' +
      '<input id="x-' + it.key + '" type="text" data-key="x-' + it.key + '" data-bind="' + ip + '.text" data-field="' + ip + '.text" maxlength="200" value="' + esc(it.text) + '"' + inv(ip + '.text') + ' placeholder="Hvad skal gøres eller tjekkes?"></div>' +
      '<div class="ed-tools">' +
      '<button class="icon-btn" type="button" data-action="item-up" data-s="' + si + '" data-i="' + ii + '" data-key="iu-' + it.key + '" aria-label="Flyt punkt op"' + (ii === 0 && (si === 0 || s.items.length === 1) ? ' disabled' : '') + '>' + ICONS.up + '</button>' +
      '<button class="icon-btn" type="button" data-action="item-down" data-s="' + si + '" data-i="' + ii + '" data-key="id-' + it.key + '" aria-label="Flyt punkt ned"' + (ii === s.items.length - 1 && (si === e.sections.length - 1 || s.items.length === 1) ? ' disabled' : '') + '>' + ICONS.down + '</button>' +
      '<button class="icon-btn danger" type="button" data-action="item-del" data-s="' + si + '" data-i="' + ii + '" data-key="ix-' + it.key + '" aria-label="Slet punkt">' + ICONS.trash + '</button>' +
      '</div></div>';
    html += '<div class="ed-item-opts"><select data-bind="' + ip + '.type" data-field="' + ip + '.type" data-key="ty-' + it.key + '" aria-label="Type">' +
      ['check', 'yesno', 'choice', 'number', 'text'].map(function (t) { return '<option value="' + t + '"' + (it.type === t ? ' selected' : '') + '>' + TYPE_LABELS[t] + '</option>'; }).join('') + '</select>' +
      '<label class="tick"><input type="checkbox" data-bind="' + ip + '.required" data-key="rq-' + it.key + '"' + (it.required ? ' checked' : '') + '> Skal udfyldes</label></div>';
    html += '<div class="ed-item-extra">';
    if (it.type === 'choice') {
      html += '<div class="field" style="margin:0"><label for="op-' + it.key + '">Valgmuligheder, én pr. linje</label><textarea id="op-' + it.key + '" data-bind="' + ip + '.optionsText" data-field="' + ip + '.options" data-key="op-' + it.key + '"' + inv(ip + '.options') + ' rows="3">' + esc(it.optionsText) + '</textarea></div>';
    }
    if (it.showHelp) {
      html += '<div class="field" style="margin:0"><label for="hp-' + it.key + '">Hjælpetekst</label><textarea id="hp-' + it.key + '" data-bind="' + ip + '.help" data-field="' + ip + '.help" data-key="hp-' + it.key + '"' + inv(ip + '.help') + ' maxlength="400" rows="2">' + esc(it.help) + '</textarea></div>';
    } else {
      html += '<div><button class="link-btn" type="button" data-action="item-help" data-s="' + si + '" data-i="' + ii + '" data-key="ih-' + it.key + '">+ Hjælpetekst</button></div>';
    }
    return html + '</div></li>';
  }

  function bindPath(path) {
    var e = S.editor;
    var m = /^s(\d+)\.(?:i(\d+)\.)?(\w+)$/.exec(path);
    if (!m) return { obj: e, prop: path };
    var s = e.sections[+m[1]];
    return { obj: m[2] !== undefined ? s.items[+m[2]] : s, prop: m[3] };
  }

  function editorPayload() {
    var e = S.editor;
    return {
      id: e.id, version: e.version, name: e.name, description: e.description, repeat: e.repeat,
      sections: e.sections.map(function (s) {
        return {
          id: s.id, title: s.title, optional: s.optional, skipLabel: s.skipLabel,
          items: s.items.map(function (it) {
            return { id: it.id, text: it.text, help: it.showHelp ? it.help : '', type: it.type, required: it.required, options: it.type === 'choice' ? it.optionsText.split('\n') : [] };
          })
        };
      })
    };
  }

  function editorAction(action, el) {
    var e = S.editor;
    var si = +el.getAttribute('data-s');
    var ii = +el.getAttribute('data-i');
    var secs = e.sections;
    var focusKey = null;
    switch (action) {
      case 'repeat': e.repeat = el.getAttribute('data-value'); break;
      case 'sec-add': var ns = blankSection(); secs.push(ns); focusKey = 't-' + ns.key; break;
      case 'sec-del':
        var sec = secs[si];
        var filled = sec.items.filter(function (it) { return it.text.trim(); }).length;
        if (sec.title.trim() || filled) {
          confirmBox('Slet afsnittet?', 'Afsnittet "' + (sec.title.trim() || 'uden overskrift') + '"' + (filled ? ' og ' + (filled === 1 ? 'dets punkt' : 'dets ' + filled + ' punkter') : '') +
            ' fjernes. Det er først endeligt, når du gemmer proceduren.', 'Slet afsnit', true).then(function (yes) {
            if (!yes || secs.indexOf(sec) < 0) return;
            secs.splice(secs.indexOf(sec), 1);
            S.dirty = true;
            S.editorError = null;
            render();
          });
          return;
        }
        secs.splice(si, 1);
        break;
      case 'sec-up': if (si > 0) secs.splice(si - 1, 0, secs.splice(si, 1)[0]); break;
      case 'sec-down': if (si < secs.length - 1) secs.splice(si + 1, 0, secs.splice(si, 1)[0]); break;
      case 'item-add': var ni = blankItem(); secs[si].items.push(ni); focusKey = 'x-' + ni.key; break;
      case 'item-del':
        secs[si].items.splice(ii, 1);
        if (!secs[si].items.length) secs[si].items.push(blankItem());
        break;
      case 'item-up':
        if (ii > 0) secs[si].items.splice(ii - 1, 0, secs[si].items.splice(ii, 1)[0]);
        else if (si > 0) secs[si - 1].items.push(secs[si].items.shift());
        if (!secs[si].items.length) secs.splice(si, 1);
        break;
      case 'item-down':
        if (ii < secs[si].items.length - 1) secs[si].items.splice(ii + 1, 0, secs[si].items.splice(ii, 1)[0]);
        else if (si < secs.length - 1) secs[si + 1].items.unshift(secs[si].items.pop());
        if (!secs[si].items.length) secs.splice(si, 1);
        break;
      case 'item-help': var hi = secs[si].items[ii]; hi.showHelp = true; focusKey = 'hp-' + hi.key; break;
    }
    S.dirty = true;
    S.editorError = null;
    render();
    if (focusKey) { var f = view.querySelector('[data-key="' + focusKey + '"]'); if (f) f.focus(); }
  }

  function saveEditor(btn) {
    btn.disabled = true;
    btn.textContent = 'Gemmer …';
    call('saveProcedure', editorPayload()).then(function (res) {
      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'Gem procedure';
        S.editorError = { error: res.error, field: res.field };
        render();
        var bad = res.field && view.querySelector('[data-field="' + res.field + '"]');
        if (bad) { bad.scrollIntoView({ block: 'center' }); if (bad.focus) bad.focus({ preventScroll: true }); }
        return;
      }
      S.dirty = false;
      setState(res.state);
      toast(res.changed === false ? 'Der var ingen ændringer.' : 'Proceduren er gemt.');
      go('#/procedurer');
    }, function (err) {
      if (err.code === 'AUTH') return;
      btn.disabled = false;
      btn.textContent = 'Gem procedure';
      S.editorError = { error: err.message, field: '' };
      var box = $('edError'); if (box) box.textContent = err.message;
    });
  }

  function setArchived(id, archived) {
    var p = S.state.procedures.filter(function (x) { return x.id === id; })[0];
    var ask = archived
      ? confirmBox('Arkivér ' + p.name.toLowerCase() + '?', 'Den kan ikke startes på nye biler. Gamle og igangværende tjeklister bliver ikke berørt, og du kan gendanne den senere.' +
          (S.dirty ? ' Dine ugemte ændringer bliver ikke gemt.' : ''), 'Arkivér', true)
      : Promise.resolve(true);
    ask.then(function (ok) {
      if (!ok) return;
      call('setProcedureArchived', { id: id, archived: archived }).then(function (state) {
        S.dirty = false;
        setState(state);
        toast(archived ? 'Proceduren er arkiveret.' : 'Proceduren er gendannet.');
        go('#/procedurer');
      }, function (err) { if (err.code !== 'AUTH') toast(err.message, true); });
    });
  }

  // ---------------------------------------------------------------------------
  // Dialoger
  // ---------------------------------------------------------------------------

  function confirmBox(title, text, okLabel, danger) {
    var dlg = $('confirmDialog');
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    var ok = $('confirmOk');
    ok.textContent = okLabel;
    ok.className = 'primary' + (danger ? ' danger' : '');
    var cancel = $('confirmCancel');
    // Svaret tages direkte fra knapperne; dialogens "close"-hændelse kommer ikke altid frem.
    return new Promise(function (resolve) {
      var done = false;
      function finish(answer) {
        if (done) return;
        done = true;
        ok.onclick = null;
        cancel.onclick = null;
        dlg.oncancel = null;
        if (dlg.open) dlg.close();
        resolve(answer);
      }
      ok.onclick = function () { finish(true); };
      cancel.onclick = function () { finish(false); };
      dlg.oncancel = function (e) { e.preventDefault(); finish(false); }; // Esc
      dlg.showModal();
      cancel.focus();
    });
  }

  function openCarDialog() {
    $('manualReg').value = '';
    $('manualModel').value = '';
    $('carFormError').hidden = true;
    $('carDialog').showModal();
    $('manualReg').focus();
  }

  $('carForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var reg = normalizeReg($('manualReg').value);
    var model = $('manualModel').value.replace(/\s+/g, ' ').trim();
    var error = !reg && !model ? 'Skriv bilens reg.nr. eller model.'
      : reg && (reg.length > 10 || !/^[A-ZÆØÅ0-9]+$/.test(reg)) ? 'Reg.nr. må kun indeholde bogstaver og tal (højst 10).'
      : '';
    if (error) { $('carFormError').textContent = error; $('carFormError').hidden = false; return; }
    $('carDialog').close();
    var inArchive = reg && archiveCars().filter(function (c) { return c.reg === reg; })[0];
    if (inArchive) {
      toast('Bilen står allerede i Bilarkivet.');
      go('#/bil/' + encodeURIComponent(inArchive.key));
      return;
    }
    var car = { archiveId: '', reg: reg, model: model, inArchive: false };
    car.key = carKey(car);
    S.manualCars[car.key] = car;
    go('#/bil/' + encodeURIComponent(car.key));
  });
  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { b.closest('dialog').close(); });
  });

  // ---------------------------------------------------------------------------
  // Adgang: kode, nøgle og log ud
  // ---------------------------------------------------------------------------

  function isStandalone() {
    return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function isIos() {
    var ua = window.navigator.userAgent || '';
    return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && window.navigator.maxTouchPoints > 1);
  }
  function guessDeviceName() {
    var ua = window.navigator.userAgent || '';
    if (/iPhone|iPod/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && window.navigator.maxTouchPoints > 1)) return 'iPad';
    if (/Android/.test(ua)) return 'Android-telefon';
    if (/Windows/.test(ua)) return 'Windows-pc';
    if (/Macintosh/.test(ua)) return 'Mac';
    return 'Enhed';
  }

  /** Skærmen, der vises, når enheden ikke har en nøgle. render = false lader en halvt udfyldt kode stå. */
  function showPair(keepExisting) {
    document.body.classList.add('unpaired');
    document.title = 'Procedurer';
    if (keepExisting && view.querySelector('#pairForm')) return;
    var notice = S.pairNotice;
    var html = '<div class="pair"><div class="card pair-card"><h1>Velkommen</h1>';
    if (!API_URL) {
      html += '<div class="banner error" role="alert"><span>Appen er ikke sat op endnu. Adressen til serveren mangler i filen config.js.</span></div></div></div>';
      view.innerHTML = html;
      return;
    }
    html += '<p class="muted">Indtast koden for at bruge appen på denne enhed. Du får en kode i regnearket Procedurer under menuen <b>Procedurer → Ny enhed</b>, eller i appen på en anden enhed under <b>Tilføj enhed</b>.</p>';
    if (notice) html += '<div class="banner warn" role="alert"><span>' + esc(notice) + '</span></div>';
    html += '<form id="pairForm" novalidate>' +
      '<div class="field"><label for="pairCode">Kode (8 cifre)</label>' +
      '<input id="pairCode" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="9" placeholder="0000 0000"></div>' +
      '<div class="field"><label for="pairName">Navn på denne enhed</label>' +
      '<input id="pairName" type="text" autocomplete="off" maxlength="40" value="' + esc(guessDeviceName()) + '"></div>' +
      '<p class="form-error" id="pairError" role="alert" hidden></p>' +
      '<button class="primary" type="submit" id="pairBtn" style="width:100%">Fortsæt</button></form>';
    if (isIos() && !isStandalone()) {
      html += '<p class="tip"><b>På iPhone:</b> Tryk først på Del-knappen i Safari og vælg <b>Føj til hjemmeskærm</b>. Åbn så appen fra ikonet, og indtast koden dér. Adgangen følger ikke med fra Safari over i appen på hjemmeskærmen.</p>';
    }
    html += '</div></div>';
    view.innerHTML = html;
  }

  function pairError(text) {
    var el = $('pairError');
    if (!el) return;
    el.textContent = text;
    el.hidden = !text;
  }

  function submitPair() {
    var code = $('pairCode').value.replace(/\D/g, '');
    if (code.length !== 8) { pairError('Skriv de 8 cifre fra koden.'); $('pairCode').focus(); return; }
    var name = $('pairName').value.replace(/\s+/g, ' ').trim() || guessDeviceName();
    var btn = $('pairBtn');
    btn.disabled = true;
    btn.textContent = 'Tjekker …';
    pairError('');
    call('pair', { code: code, deviceName: name }).then(function (res) {
      var saved = store.set(KEY_STORE, res.key);
      S.key = res.key;
      S.pairNotice = '';
      S.state = null;
      S.loadError = '';
      store.remove(OPS_STORE);
      render(true);
      loadState(false);
      if (!saved) toast('Adgangen kunne ikke gemmes på denne enhed. Du skal indtaste en kode igen, når appen lukkes.', true);
    }, function (err) {
      var b = $('pairBtn');
      if (!b) return;
      b.disabled = false;
      b.textContent = 'Fortsæt';
      pairError(err.message);
      var input = $('pairCode');
      if (input && err.code !== 'LIMIT') { input.focus(); input.select(); }
    });
  }

  function openAccount() {
    if (!S.state) return;
    var name = S.state.device && S.state.device.name;
    $('accountInfo').textContent = 'Du er logget ind som ' + personName(S.state.user) + (name ? ' på enheden "' + name + '"' : '') + '.';
    $('accountCodeBox').hidden = true;
    $('accountError').hidden = true;
    $('accountAdd').disabled = false;
    $('accountAdd').textContent = 'Tilføj enhed';
    $('accountDialog').showModal();
  }

  function accountError(text) {
    $('accountError').textContent = text;
    $('accountError').hidden = !text;
  }

  function addDevice() {
    var btn = $('accountAdd');
    btn.disabled = true;
    btn.textContent = 'Henter kode …';
    accountError('');
    call('createPairingCode').then(function (res) {
      btn.disabled = false;
      btn.textContent = 'Lav en ny kode';
      $('accountCode').textContent = res.display;
      $('accountCodeInfo').textContent = 'Til ' + res.person + '. Åbn appen på den nye enhed, og indtast koden. Den gælder i ' + res.minutes +
        ' minutter (til kl. ' + fmtTime(res.expiresAt) + ') og kan kun bruges én gang.';
      $('accountCodeBox').hidden = false;
    }, function (err) {
      if (err.code === 'AUTH') return;
      btn.disabled = false;
      btn.textContent = 'Tilføj enhed';
      accountError(err.message);
    });
  }

  function logOut() {
    $('accountDialog').close();
    confirmBox('Log ud på denne enhed?', 'Enheden bliver spærret. Du skal bruge en ny kode for at åbne appen her igen.' +
      (S.ops.length ? ' Der er ændringer, som ikke er gemt endnu, og de går tabt.' : ''), 'Log ud', true).then(function (ok) {
      if (!ok) return;
      call('logoutDevice').then(function () {
        resetSession('Du er logget ud på denne enhed.');
      }, function (err) {
        if (err.code === 'AUTH') return;
        toast(err.retry ? 'Du blev ikke logget ud, fordi serveren ikke kunne nås. Prøv igen med forbindelse.' : err.message, true);
      });
    });
  }

  // ---------------------------------------------------------------------------
  // Hændelser
  // ---------------------------------------------------------------------------

  document.addEventListener('submit', function (ev) {
    var id = ev.target.id;
    if (id === 'pairForm') { ev.preventDefault(); submitPair(); }
    else if (id === 'plateForm') { ev.preventDefault(); lookupNow(); }
    else if (id === 'eqForm') { ev.preventDefault(); submitEquipment(); }
    else if (id === 'dfForm') { ev.preventDefault(); submitDefect(); }
    else if (id === 'ncEqForm') {
      ev.preventDefault();
      var name = $('ncEqNew').value.replace(/\s+/g, ' ').trim();
      if (!name || !S.newCar) return;
      var dup = S.newCar.equip.some(function (e) { return e.name.toLowerCase() === name.toLowerCase(); });
      if (dup) toast('Det udstyr står allerede på listen.');
      else S.newCar.equip.push({ name: name, source: 'egen', checked: true });
      render(true);
      if ($('ncEqNew')) $('ncEqNew').focus();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNoteDraft(); });
  window.addEventListener('pagehide', saveNoteDraft);
  $('syncText').addEventListener('click', function () { toast(this.getAttribute('data-full') || this.textContent, true); });
  $('accountBtn').addEventListener('click', openAccount);
  $('accountAdd').addEventListener('click', addDevice);
  $('accountLogout').addEventListener('click', logOut);

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var action = el.getAttribute('data-action');
    switch (action) {
      case 'reload': S.loadError = ''; render(); loadState(false); return;
      case 'manual-car': openCarDialog(); return;
      case 'new-car': openNewCar(); return;
      case 'nc-manual': manualNewCar(); return;
      case 'nc-reset':
        if (S.newCar) { S.newCar.step = 'plate'; S.newCar.error = ''; S.newCar.fieldError = ''; S.newCar.existing = null; }
        render(true);
        return;
      case 'nc-open':
        var existing = S.newCar && S.newCar.existing;
        if (existing) { S.newCar = null; go('#/bil/' + encodeURIComponent(existing.key)); loadState(true); }
        return;
      case 'nc-eq-del':
        if (S.newCar) { S.newCar.equip.splice(+el.getAttribute('data-i'), 1); render(true); }
        return;
      case 'create-car': createCarNow(); return;
      case 'info-retry':
        var shownCar = currentCar();
        if (shownCar) { delete S.info[shownCar.key]; render(); }
        return;
      case 'note-mine':
        var mineCar = currentCar();
        var mineConflict = mineCar && S.noteConflicts[mineCar.key];
        if (mineConflict) {
          delete S.noteConflicts[mineCar.key];
          persistNoteConflicts();
          S.noteDraft = { key: mineCar.key, text: mineConflict.mine };
          saveNoteDraft();
          render(true);
        }
        return;
      case 'note-dismiss':
        var dismissCar = currentCar();
        if (dismissCar && S.noteConflicts[dismissCar.key]) { delete S.noteConflicts[dismissCar.key]; persistNoteConflicts(); render(true); }
        return;
      case 'eq-del': removeInfoItem('equipment', el.getAttribute('data-id')); return;

      case 'df-del': removeInfoItem('defects', el.getAttribute('data-id')); return;
      case 'photo-retry':
        var photoCar = currentCar();
        if (photoCar) retryPhotos(photoCar.key);
        return;
      case 'start': startRun(el); return;
      case 'retry-run': S.runError = ''; render(); return;
      case 'retry-save':
        // iOS viser ikke hjælpetekster: tryk på "Ikke gemt endnu" viser hele forklaringen (hver gang) og prøver så igen.
        if (el.id === 'saveState' && saveStateTitle()) toast(saveStateTitle(), true);
        flush(true); return;
      case 'print': window.print(); return;
      case 'finish-run': finishCurrentRun(); return;
      case 'cancel-run': cancelCurrentRun(); return;
      case 'more-history': S.hist.limit += 200; $('histList').innerHTML = historyList(); return;
      case 'archive': setArchived(el.getAttribute('data-id'), el.getAttribute('data-archived') === '1'); return;
      case 'ed-save': saveEditor(el); return;
      case 'goto-item':
        var target = $('it-' + el.getAttribute('data-item'));
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          var input = target.querySelector('input, button, textarea');
          if (input) input.focus({ preventScroll: true });
        }
        return;
      case 'pick':
        if (!S.run || S.run.status !== STATUS.OPEN) return;
        var itemId = el.getAttribute('data-item');
        var value = el.getAttribute('data-value');
        var current = S.run.answers[itemId];
        setAnswer(itemId, current && current.value === value ? null : value); // tryk igen for at fjerne valget
        render();
        return;
      case 'skip':
        if (!S.run || S.run.status !== STATUS.OPEN) return;
        var sid = el.getAttribute('data-section');
        var skip = !S.run.skipped[sid];
        if (skip) S.run.skipped[sid] = { at: Date.now(), by: S.state.user }; else delete S.run.skipped[sid];
        S.run.progress = progressOf(S.run);
        save('skipChecklistSection', { runId: S.run.id, sectionId: sid, skipped: skip });
        render();
        return;
    }
    if (S.editor && parseRoute().name === 'procedure') editorAction(action, el);
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.hasAttribute('data-df-fix')) { toggleDefect(el); return; }
    if (el.id === 'carNote') {
      var noteCar = currentCar();
      if (noteCar) { S.noteDraft = { key: noteCar.key, text: el.value }; saveNoteDraft(); }
      return;
    }
    if (el.id === 'carPhotos') {
      var photosCar = currentCar();
      var picked = Array.prototype.slice.call(el.files || []);
      el.value = '';
      if (photosCar && picked.length) addPhotos(photosCar, picked);
      return;
    }
    if (el.id === 'dfPhoto') {
      var dfCar = currentCar();
      var file = el.files && el.files[0];
      S.dfPhoto = dfCar && file ? { key: dfCar.key, file: file } : null;
      var label = $('dfPhotoBtn');
      if (label) label.childNodes[0].nodeValue = S.dfPhoto ? 'Billede valgt ✓' : 'Billede';
      return;
    }
    if (el.hasAttribute('data-nc-eq') && S.newCar) {
      S.newCar.equip[+el.getAttribute('data-nc-eq')].checked = el.checked;
      if ($('ncEqCount')) $('ncEqCount').textContent = ncEquipCount(S.newCar);
      return;
    }
    if (el.id === 'histProc') { S.hist.proc = el.value; $('histList').innerHTML = historyList(); return; }
    if (el.id === 'histStatus') { S.hist.status = el.value; $('histList').innerHTML = historyList(); return; }
    if (el.hasAttribute('data-bind') && S.editor) {
      var b = bindPath(el.getAttribute('data-bind'));
      if (el.type === 'checkbox') {
        b.obj[b.prop] = el.checked;
        S.dirty = true;
        render();
      } else if (el.tagName === 'SELECT') {
        b.obj[b.prop] = el.value;
        if (el.value === 'choice' && !b.obj.optionsText) b.obj.optionsText = '';
        S.dirty = true;
        render();
      }
      return;
    }
    if (!S.run || S.run.status !== STATUS.OPEN || !view.contains(el)) return;
    var itemId = el.getAttribute('data-item');
    if (itemId && el.type === 'checkbox') {
      setAnswer(itemId, el.checked);
      // Kun dette punkt og fremdriften tegnes om, så siden ikke hopper.
      var holder = $('it-' + itemId);
      var a = S.run.answers[itemId];
      var body = holder && holder.lastElementChild;
      if (body) {
        var who = body.querySelector('.item-who');
        if (who) who.remove();
        if (a) body.insertAdjacentHTML('beforeend', whoLine(a));
      }
      refreshSectionCounts();
      refreshRunChrome();
      return;
    }
    if (itemId) {
      var raw = el.value;
      if (el.classList.contains('num-input') && raw.trim() && !isFinite(parseNumberLoose(raw))) {
        el.setAttribute('aria-invalid', 'true');
        toast('Skriv et tal, fx 45.230.', true);
        return;
      }
      el.removeAttribute('aria-invalid');
      setAnswer(itemId, raw.trim() === '' ? null : raw);
      refreshSectionCounts();
      refreshRunChrome();
      return;
    }
    if (el.id === 'runNote') {
      S.run.note = el.value.trim();
      save('saveChecklistNote', { runId: S.run.id, note: el.value });
    }
  });

  function parseNumberLoose(v) {
    var s = String(v).replace(/\s|\u00A0/g, '');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
  }

  function refreshSectionCounts() {
    if (!S.run) return;
    S.run.sections.forEach(function (section) {
      var h = $('sech-' + section.id);
      var c = h && h.querySelector('.sec-count');
      if (c) c.textContent = section.items.filter(function (it) { return isAnswered(it, S.run.answers[it.id]); }).length + '/' + section.items.length;
    });
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'newReg' && S.newCar) {
      var cleaned = el.value.replace(/[^A-Za-z0-9 ]/g, '');
      if (cleaned !== el.value) el.value = cleaned;
      S.newCar.reg = cleaned;
      return;
    }
    if (el.hasAttribute('data-nc') && S.newCar) {
      var field = el.getAttribute('data-nc');
      if (field === 'notes') S.newCar.notes = el.value; else S.newCar.f[field] = el.value;
      if (el.getAttribute('aria-invalid')) el.removeAttribute('aria-invalid');
      return;
    }
    if (el.id === 'carNote') {
      var typingCar = currentCar();
      if (typingCar) {
        S.noteDraft = { key: typingCar.key, text: el.value };
        clearTimeout(S.noteTimer);
        S.noteTimer = setTimeout(saveNoteDraft, 1500);
        if ($('noteState')) $('noteState').textContent = 'Gemmes automatisk.';
      }
      return;
    }
    if (el.id === 'carSearch') {
 S.search = el.value; $('carLists').innerHTML = carLists(); return; }
    if (el.id === 'histSearch') { S.hist.q = el.value; S.hist.limit = 200; $('histList').innerHTML = historyList(); return; }
    if (el.hasAttribute('data-bind') && S.editor && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
      var b = bindPath(el.getAttribute('data-bind'));
      b.obj[b.prop] = el.value;
      S.dirty = true;
      if (el.getAttribute('aria-invalid')) { el.removeAttribute('aria-invalid'); }
    }
  });

  // Enter i et tal-felt gemmer med det samme.
  document.addEventListener('keydown', function (ev) {
    var el = ev.target;
    if (ev.key === 'Enter' && el.classList && el.classList.contains('num-input')) { ev.preventDefault(); el.blur(); }
  });

  document.addEventListener('focusout', function () {
    setTimeout(function () { if (S.renderDeferred) render(); }, 0);
  });

  // ---------------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------------

  S.hash = /^#\//.test(location.hash) ? location.hash : '#/biler';
  if (S.hash !== location.hash) history.replaceState(null, '', S.hash);
  render(true);
  if (S.key) {
    S.ops = loadStoredOps();     // ændringer, der ikke nåede frem sidst, sendes nu
    S.pending = S.ops.length;
    S.resumed = S.ops.length;
    persistOps();
    loadState(false);
    flush();
  }

  if ('serviceWorker' in navigator && !window.PROCEDURER_NO_SW && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* appen virker også uden */ }); });
  }
})();
</script>
</body>
</html>
